# Raw (non-clustered) env maps along the whales tracks, for input_keys plots and swirl_track_series inputs.
#   python -m naturenet.models.feature_rep.env_data_format -y config/environment/whales_env_format_inputs.yaml
# Writes <out_dir>/<output_uid><key>.pkl per track key and <out_dir>/<output_uid>SWIRL_WHALE_v1.pkl (merged).
# Use the same scene list / dates / mask as the abstract-env (cluster) run, only on the raw cop_env scenes.
# Channels (C = 6): [T, U, V, zooc, npp, CHL]
df_uid: "SWIRL_WHALE_v1"
df_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/"
out_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/input_env/"
output_uid: "input_env_maps_"
scene_file_template: "/data/nlahaye/NatureNet_Env/Copernicus/cop_env_whales_t{i}.zarr"
n_days: 155               # number of cop_env_whales_t<i>.zarr scenes
start_time: "2017-07-10"              # first scene date of the whale cop_env series
# scene_dates_file: "/data/nlahaye/NatureNet_Env/Copernicus/cop_env_whales_dates.json"   # preferred if written by preprocess_copernicus
nearest_scene_days: 0         # = the abstract run
strict_scene_coverage: True
mask_path: "/data/nlahaye/remoteSensing/watermask_2025.whale.2.ocean.tif"             # same water mask as the abstract env_data_format run
land_value: 0                 # TODO: same as the abstract run
land_fill: nan                # raw features: -1 is a valid value, so land -> NaN
sit_fuse_output: False        # no cluster compression / class mapper for raw inputs
