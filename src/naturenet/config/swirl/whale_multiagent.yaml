# Coupled-intention multi-agent test on the 2017 California blue whales (Bmu_2017CA), env window 2017-07-10 + 155 d.
# All 23 tags lie inside the window; median 8 animals tracked per day; 71% of animal-days have a partner < 75 km.
# Same model / CV / nulls as the hammerhead test (hiavi_multiagent.yaml, swirl_multiagent.yaml).
#   python -m naturenet.models.irl.run_hiavi_multiagent  -y whale_multiagent.yaml --concurrency_only   # 1) coverage
#   python -m naturenet.models.irl.run_hiavi_multiagent  -y whale_multiagent.yaml [--skip_null]        # 2) HIAVI
#   python -m naturenet.models.irl.run_swirl_multiagent  -y whale_multiagent.yaml [--skip_null]        # 3) SWIRL
#   python -m naturenet.models.irl.plot_hiavi_multiagent -y whale_multiagent.yaml [--subdir multiagent_swirl]
#   python -m naturenet.models.irl.plot_multiagent_compare --dirs <out_dir>/multiagent <out_dir>/multiagent_swirl --out <out_dir>/ma_compare
# Outputs: <out_dir>/multiagent (HIAVI) and <out_dir>/multiagent_swirl (SWIRL); ma_subdir is left unset on purpose.

seed: 12345
n_hidden: 2
n_states: 75                          # TODO: set to the whale abstract-env n_clusters (+1 if invalid absorbing)
out_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/multiagent/"
run_uid: "WHALE_MA"

# All keys (originals + __aug copies) of the animals in the window; positions "auto" pairs each actions file
# with its _states_abstract_env.pkl. multiagent.animals restricts to those base ids.
actions: "/data/nlahaye/NatureNet/Blue_Whale_v1/SWIRL_WHALE_v1_*_actions.pkl"
positions: "auto"
df_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/"
df_run_uid: "SWIRL_WHALE_v1"           # step times / positions from <df_dir>/<df_run_uid>_dfs.pkl

per_fold_trans_prob: True             # T from the training animals of each fold
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 20
segment_policy: "chunk"

hiavi_discount: 0.9
hiavi_restarts: 10
hiavi_mstep: "soft"
hiavi_pseudocount: 0.5
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"

multiagent:
  backend: "hiavi"            # default for run_hiavi_multiagent; run_swirl_multiagent / --backend swirl override
  swirl:
    init: "arhmm"             # arhmm (kinematic ARHMM warm start, as in run_swirl_kfold) | sticky
    arhmm_epochs: 50
    restarts: 1               # independent-model restarts per fold (best train LL kept)
    epochs: 30                # stage 1 (S-1 EM)
    epochs_2: 20              # stage 2 (EM with temps_final)
    coupled_iters: 10         # EM iterations per mean-field outer iteration (n_outer)
  # animals: null -> all 23 tags (all inside the window); 825 (4 d) and 5800 (8 d) only act as partners
  heldout_animals: ["10826", "847", "1385", "835", "845", "4176", "10831", "841", "5840", "5910", "5803", "827",
                    "826", "831", "5921", "10840", "5648", "5670", "5679", "10830", "23031"]
  # SWIRL backend: the 10 best-connected animals keep runtime manageable (override on the CLI config copy)
  # heldout_animals: ["10826", "847", "1385", "835", "845", "4176", "10831", "841", "5840", "5910"]
  max_aug: 2                  # originals + __aug1..2 per whale (10 copies -> 11x data and 121x kernel pairs)
  window: ["2017-07-10", "2017-12-12"]               # whale env window, calendar for the time-shift null
  Ks: [2, 3, 4]                                      # 23 animals support K = 3-4 as sensitivity
  variants:
    temporal:  {h_days: 1.0, max_dt_days: 3.0}                               # co-timing only
    proximity: {h_days: 1.0, max_dt_days: 3.0, lambda_km: 20.0, max_km: 75.0}   # local (1215 pair-days < 20 km)
    proximity_wide: {h_days: 1.0, max_dt_days: 3.0, lambda_km: 50.0, max_km: 150.0}  # = hammerhead kernel
  n_outer: 5                  # mean-field outer iterations (context <-> posteriors)
  alpha0: 0.1                 # initial coupling
  n_null: 50                  # time-shift replicates (HIAVI); use 20 for the SWIRL backend (cost)
  null_variants: ["temporal", "proximity"]
  null_min_shift_days: 20     # U(20, 135) d in the 155-d window (track spans 3-150 d)
  n_null_sync: 500            # replicates for the synchrony index (no refit; cheap)
  sync_variant: "temporal"
  eval_include_aug: False     # score held-out ORIGINAL tracks only (copies are not independent data)
  min_context_steps: 30       # warn if < 2 animals reach this many steps with partner context
  # dfs_pkl: "/data/nlahaye/NatureNet/Blue_Whale_v1/SWIRL_WHALE_v1_dfs.pkl"


# SWIRL keys (as in init_test_swirl.yaml)
emission_dim: 1
latent_state_dim: 1
temps_final: 1.0              # all intentions at temperature 1 in stage 2, for every K (the default
                              # [0.01, 1, ...] collapsed K=2 to one intention without kinematics in the synthetic test)
em_tol: null

# Kinematics: whale Argos steps are error-dominated at short dt (median apparent speed 6.3 km/h at 0.5-1 h vs
# 1.7 km/h at 6-24 h). Run the action-only test first; enable kinematics on SSM-regularised tracks
# (aniMotum / crawl, 4-6 h step, step_feature step_km), or as a sensitivity with min_dt_h 3 (45% of steps kept).
kinematics:
  enabled: False
  step_feature: "speed_kmh"
  step_dist: "gamma"
  zero_km: 0.05
  min_dt_h: 3.0
  max_speed_kmh: 15.0
  label_margin: 0.5
