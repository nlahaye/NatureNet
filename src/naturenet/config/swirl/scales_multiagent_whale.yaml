# Multi-agent decision scales on the 2017 California blue whales (whale_multiagent.yaml data block + the
# scales_multiagent.yaml experiment block). Primary synchrony case: 23 tags inside the 155-d env window.
#   python -m naturenet.models.irl.run_hiavi_multiagent  -y scales_multiagent_whale.yaml --concurrency_only
#   python -m naturenet.models.irl.run_scales_multiagent -y scales_multiagent_whale.yaml --backend hiql_scales --skip_null
#   python -m naturenet.models.irl.run_scales_multiagent -y scales_multiagent_whale.yaml --backend hiql_scales --variant <kept>
#   python -m naturenet.models.irl.plot_scales_multiagent -y scales_multiagent_whale.yaml
# seq_len 40 (chunk) leaves room for durations (max_duration 12 <= seq_len / 3) and regimes. Order <= 2 by
# default (S1_N3_hist only if deep contexts have >= ~20 steps each; see FULL_TEST_PLAN.md). SWIRL-scales: use the
# 10 best-connected held-out animals and n_null 20 (cost).

seed: 12345
n_hidden: 2
n_states: 75                          # TODO: set to the whale abstract-env n_clusters (+1 if invalid absorbing)
out_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/multiagent_scales/"
run_uid: "WHALE_SCALES_MA"

# All keys (originals + __aug copies) of the animals in the window; positions "auto" pairs each actions file
# with its _states_abstract_env.pkl. multiagent.animals restricts to those base ids.
actions: "/data/nlahaye/NatureNet/Blue_Whale_v1/SWIRL_WHALE_v1_*_actions.pkl"
positions: "auto"
df_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/"
df_run_uid: "SWIRL_WHALE_v1"           # step times / positions from <df_dir>/<df_run_uid>_dfs.pkl

per_fold_trans_prob: True             # T from the training animals of each fold
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 40
segment_policy: "chunk"

hiavi_discount: 0.9
hiavi_restarts: 10
hiavi_mstep: "soft"
hiavi_pseudocount: 0.5
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"

multiagent:
  scales_backends: ["hiql_scales", "swirl_scales"]
  swirl:                      # SWIRL-scales init / schedule (as swirl_multiagent)
    init: "arhmm"
    arhmm_epochs: 50
    restarts: 2
    epochs: 30
    epochs_2: 20
    coupled_iters: 10
    ctx_source: independent   # partner context from own-evidence posteriors (mean_field: coupled, echo-prone)
  scales_defaults:            # shared by every variant; "on" toggles take these blocks
    reward_l2: 1.0
    reward_tol: null          # 1e-4 at order 1, 1e-8 above
    context_min_count: 3      # deep contexts seen >= 3 times in the training animals
    switch_history: {kind: ["lags"], lags: 2}
    durations: {max_duration: 12, hazard: "logistic", l2: 0.01}
    hierarchy: {n_regimes: 2, sticky: 0.95, init_noise: 0.5}
    hiql: {backoff: 5.0}      # HIQL: Dirichlet back-off of deep contexts to their parent (inf = order 1)
    coupling: {fit_alpha: True, fit_beta: True, beta0: 0.0, tol: 1.0e-8}
    coupled_iters: 10
    ctx_source: independent   # partner context from own-evidence posteriors (mean_field: coupled, echo-prone)
  scales_variants:
    # step 1: order N + switching history, destination coupling (alpha)
    - {name: S1_N1, step: 1, order: 1}
    - {name: S1_N2_hist, step: 1, order: 2, switch_history: on}
    - {name: S1_N3_hist, step: 1, order: 3, switch_history: on}
    # step 2: per-animal regimes, shared alpha
    - {name: S2_N1_R2, step: 2, order: 1, hierarchy: on}
    - {name: S2_N2_R2, step: 2, order: 2, switch_history: on, hierarchy: on}
    # step 3: durations with partner-driven hazards (beta; alpha too when K > 2)
    - {name: S3_N1_dur, step: 3, order: 1, durations: on}
    - {name: S3_N2_dur_R2, step: 3, order: 2, durations: on, hierarchy: on}
  # animals: null -> all 23 tags (all inside the window); 825 (4 d) and 5800 (8 d) only act as partners
  heldout_animals: ["10826", "847", "1385", "835", "845", "4176", "10831", "841", "5840", "5910", "5803", "827",
                    "826", "831", "5921", "10840", "5648", "5670", "5679", "10830", "23031"]
  # SWIRL backend: the 10 best-connected animals keep runtime manageable (override on the CLI config copy)
  # heldout_animals: ["10826", "847", "1385", "835", "845", "4176", "10831", "841", "5840", "5910"]
  max_aug: 2                  # originals + __aug1..2 per whale (10 copies -> 11x data and 121x kernel pairs)
  window: ["2017-07-10", "2017-12-12"]               # whale env window, calendar for the time-shift null
  Ks: [2, 3]                                         # K = 3 needed for alpha with durations
  variants:
    temporal:  {h_days: 1.0, max_dt_days: 3.0}                               # co-timing only
    proximity: {h_days: 1.0, max_dt_days: 3.0, lambda_km: 20.0, max_km: 75.0}   # local (1215 pair-days < 20 km)
    proximity_wide: {h_days: 1.0, max_dt_days: 3.0, lambda_km: 50.0, max_km: 150.0}  # = hammerhead kernel
  n_outer: 5                  # mean-field outer iterations (context <-> posteriors)
  alpha0: 0.1                 # initial coupling
  n_null: 50                  # time-shift replicates (HIQL); use 20 for swirl_scales (cost)
  null_variants: ["temporal", "proximity"]
  null_min_shift_days: 20     # U(20, 135) d in the 155-d window (track spans 3-150 d)
  n_null_sync: 500            # replicates for the synchrony index (no refit; cheap)
  sync_variant: "temporal"
  eval_include_aug: False     # score held-out ORIGINAL tracks only (copies are not independent data)
  min_context_steps: 30       # warn if < 2 animals reach this many steps with partner context
  # dfs_pkl: "/data/nlahaye/NatureNet/Blue_Whale_v1/SWIRL_WHALE_v1_dfs.pkl"


# SWIRL keys (as in init_test_swirl.yaml)
emission_dim: 1
latent_state_dim: 1
temps_final: 1.0              # all intentions at temperature 1 in stage 2, for every K (the default
                              # [0.01, 1, ...] collapsed K=2 to one intention without kinematics in the synthetic test)
em_tol: null

# Kinematics: whale Argos steps are error-dominated at short dt (median apparent speed 6.3 km/h at 0.5-1 h vs
# 1.7 km/h at 6-24 h). Run the action-only test first; enable kinematics on SSM-regularised tracks
# (aniMotum / crawl, 4-6 h step, step_feature step_km), or as a sensitivity with min_dt_h 3 (45% of steps kept).
kinematics:
  enabled: False
  step_feature: "speed_kmh"
  step_dist: "gamma"
  zero_km: 0.05
  min_dt_h: 3.0
  max_speed_kmh: 15.0
  label_margin: 0.5
