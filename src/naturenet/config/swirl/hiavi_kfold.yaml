# HIAVI K-fold CV / final run / plots on the SWIRL data pipeline.
#   python -m naturenet.models.irl.get_stats_hiavi -y hiavi_kfold.yaml [--n_hidden K] [--run i] [--fold k ...]
#   python -m naturenet.models.irl.run_hiavi_kfold -y hiavi_kfold.yaml [--fold k ...] | --holdout
#   python -m naturenet.models.irl.plot_hiavi      -y hiavi_kfold.yaml

seed: 12345                 # base seed; get_stats_hiavi runs use seed + run index
n_hidden_init: 3
n_hidden: 3                 # K for run_hiavi_kfold / plot_hiavi (get_stats_hiavi sweeps min..max_latent)
n_states: 75
out_dir: "/mnt/data/NatureNet/Hammerhead_Out_v1/hiavi/"
run_uid: "HIAVI_TEST"       # get_stats_hiavi appends _loop_<i>_latent_<K>_states; plot that run_uid / seed

actions:
  - "/mnt/data/NatureNet/Hammerhead_Out_v1/hammerhead_v1_183623_1_actions.pkl"
positions:
  - "/mnt/data/NatureNet/Hammerhead_Out_v1/hammerhead_v1_183623_1_states_abstract_env.pkl"

# Transitions: per fold from the train animals (no leakage); trans_probs only if per_fold_trans_prob False
trans_probs: "/mnt/data/NatureNet/Hammerhead_Out_v1/hammerhead_v1_trans_prob_abstract_env.npz"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True

# Sequences (same as SWIRL; segment_policy chunk + seq_len for unequal track lengths)
seq_len: null
segment_policy: "exact"

# Folds: same file as the SWIRL / ARHMM runs (point folds_dir at the SWIRL out_dir to share them)
n_folds: 5
fold_seed: 0
# folds_dir: "/mnt/data/NatureNet/Hammerhead_Out_v1/"
folds_to_run: null
holdout_fraction: 0.2
# holdout_groups: ["183623"]
overwrite: False

# HIAVI
hiavi_discount: 0.9
hiavi_restarts: 10          # best restart by TRAIN LL
hiavi_mstep: "soft"         # soft (deterministic EM) | sample (hiql's stochastic responsibilities)
hiavi_pseudocount: 0.5      # Dirichlet smoothing of per-intention (s, a) counts; 0 = hiql (unseen (s, a) -> log 1e-6, poor test LL)
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95          # initial self-transition weight of the intention chain
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"        # swirl (s = states[:, 1:-1], comparable to SWIRL) | full (s = states[:, :-1])
run_hiavi_kfold: True
run_hiavi_final: True       # get_stats_hiavi: also run the holdout fit per (K, run)

# Sweep (get_stats_hiavi)
min_latent: 2
max_latent: 6
num_runs: 3

# Plots / time series (plot_hiavi -> plot_swirl_new.run_plots with swirl_model hiavi)
df_dir: "/mnt/data/NatureNet/Hammerhead_Out_v1/"
df_run_uid: "hammerhead_v1"
lon_bounds: [-125, -115]
lat_bounds: [28, 36]
splits: ["train", "test"]
plot_trajs: True
plot_gifs: False
# envs: "/mnt/data/NatureNet/Hammerhead_Out_v1/envs.pkl"
# hiavi_env_map: "/mnt/data/NatureNet/Hammerhead_Out_v1/env_map.npy"   # (H, W) abstract env states
# env_lon_bounds: [-125, -115]
# env_lat_bounds: [28, 36]
plot_inputs: False
input_keys: []
static_layers: {}
reward_normalize: "none"
hiavi_plot_series: True
hiavi_cv_plot: True
# plot_dir: "/mnt/data/NatureNet/Hammerhead_Out_v1/hiavi/plots"
