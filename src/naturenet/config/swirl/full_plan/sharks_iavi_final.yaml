# Final single-animal IAVI (single-intention HIAVI) fit (sharks, K = 1) for maps, time series and reward projection.
#   python -m naturenet.models.irl.run_hiavi_kfold        -y full_plan/sharks_iavi_final.yaml --holdout
#   python -m naturenet.models.irl.plot_hiavi             -y full_plan/sharks_iavi_final.yaml
#   python -m naturenet.models.irl.reward_env_projection  -y full_plan/sharks_iavi_final.yaml -p full_plan/sharks_reward_env_projection.yaml --n_hidden 1   (set model: hiavi in the -p file)
# Same data block and HIAVI settings as the Phase B CV. Check n_states / actions against the Phase B YAML you ran.
# --- shared data block (identical to the Phase B / C shark configs -> same sequences) ---
n_states: 75                # = n_clusters of the abstract env (n_clusters + 1 with invalid_state: absorbing); = Phase B
actions: "/data/nlahaye/NatureNet/Hammerhead_Out_v1/hammerhead_v1_*_actions.pkl"   # originals + __aug copies
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v1/"
df_run_uid: "hammerhead_v1" # step times / positions from <df_dir>/<df_run_uid>_dfs.pkl
per_fold_trans_prob: True   # T from the training animals of each fold
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy (= Phase B / C)
segment_policy: "variable"
min_seq_len: 10
n_folds: 5                  # unused by the multi-agent runner (leave-one-animal-out), kept identical
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v1/folds/"
# --- end shared data block ---


seed: 12345
n_hidden_init: 1
n_hidden: 1
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v1/final/iavi/"
run_uid: "SHARK_IAVI_FINAL"

holdout_fraction: 0.0   # train on every animal
overwrite: False

hiavi_discount: 0.9
hiavi_restarts: 1
hiavi_mstep: "soft"
hiavi_pseudocount: 0.5      # same smoothing as HIAVI (0 = original hiql: unseen (s, a) -> log 1e-6)
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95          # unused at K = 1
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"        # s = states[:, 1:-1], comparable to SWIRL

lon_bounds: [-100, -60]    # = hammerhead_movement_preprocess.yaml (was the whale-like [-125, -115])
lat_bounds: [20, 40]
splits: ["train"]
plot_trajs: True
plot_gifs: False
# input_keys = cop_env channel order; needs <df_dir>/hammerhead_v1_<key>_states_input.pkl from
#   env_data_format -y config/environment/sharks_env_format_inputs.yaml, then
#   movement_preprocess_pipeline -y config/environment/sharks_gather_input.yaml
plot_inputs: True
input_keys: [nppv, o2, ph, dissic, fe, no3, po4, si, phyc, zooc, zos, sea_surface_temperature_anomaly, uo, vo, so, thetao, wo, VCMX, VHM0, VHM0_SW1, VHM0_WW, VMDR, VMDR_SW1, VMDR_WW, VMXL, VPED, VTM01_SW1, VTM01_WW, VTPK]
static_layers: {}
reward_normalize: "none"
hiavi_plot_series: True
hiavi_cv_plot: False   # CV curves come from the Phase B dir / plot_ll_comparison
run_hiavi_kfold: False
run_hiavi_final: True
plot_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v1/final/iavi/plots/"
