# Full plan, Phase B (whales): single-agent baselines (ARHMM init, SWIRL S-1 / S-2), K = 1..5, 3 runs, 5 folds.
#   python -m naturenet.models.irl.get_stats   -y full_plan/whales_swirl_kfold.yaml [--n_hidden K] [--run i] [--fold k]
#   python -m naturenet.models.irl.get_stats_2 -y full_plan/whales_swirl_kfold.yaml [--n_hidden K] [--run i] [--fold k]
# trans_probs is not needed (per_fold_trans_prob: True). The shorter seq_len (40 vs 60 for sharks) means whale and
# shark LLs are not directly comparable; compare methods / K within a species.
# --- shared data block (identical in every full_plan whale config -> comparable LLs, shared folds) ---
n_states: 99                # TODO: whale abstract-env n_clusters (+1 if invalid_state: absorbing)
actions: "/data/nlahaye/NatureNet/Blue_Whale_v1/SWIRL_WHALE_v1_*_actions.pkl"   # originals + __aug copies
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/"
df_run_uid: "SWIRL_WHALE_v1"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # chunk windows: whales have ~360 original fixes/animal (17-640); D <= 12, regimes
segment_policy: "variable"     # or "variable": one sequence per valid run, seq_len = MAX length (runs split into
                            # near-equal pieces; null = no cap), padded + masked (exact LLs). Not for NN-SWIRL.
min_seq_len: 10           # variable only: drop runs shorter than this (default 3); set >= 3 * max_duration
n_folds: 5                  # 23 animals -> 4-5 per test fold (folds group by base id, so __aug copies stay together)
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/folds/"   # one fold file for ARHMM, SWIRL, HIAVI and decision scales
# --- end shared data block ---

seed: 12345                 # base seed; get_stats* runs use seed + run index
n_hidden_init: 2
n_hidden: 2                 # must equal n_hidden_init (ARHMM / init params are per K)
emission_dim: 1
latent_state_dim: 1
out_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/baselines/"
run_uid: "WHALE_SWIRL_BASE"

folds_to_run: null          # e.g. [0, 1]; or --fold on the command line
holdout_fraction: 0.2       # final run: hold out animals (0 = train on all, no test LLs)

# Training
epochs_init: 50
epochs_init_2: 30
epochs: 50
epochs_2: 30
em_tol: null                # e.g. 1.0e-5 relative LL change for early stopping (null = fixed epochs)
# --- Speed (see CHANGES_SPEED.md). Exact options first, then the ones that trade accuracy for time. ---
s2_structured_vi: True      # exact: S-2 value iteration on T (S,A,S) + gather instead of the dense (S*M,A,S*M) new_T
                            #   (M^2 less VI compute, no dense S-2 tensor on host/GPU). False = previous dense path.
mstep_suff_stats: True      # exact: M-step objectives from per-E-step counts (independent of N and T)
mstep_emit_method: "auto"   # BFGS for <= mstep_emit_bfgs_max_params rewards (S-1, as before), else L-BFGS-B (S-2).
                            #   scipy BFGS's dense inverse Hessian costs ~1 s / iteration at K*S*M ~ 3000. "BFGS" = old.
mstep_emit_bfgs_max_params: 1000
mstep_emit_iters: 1000      # max optimizer iterations per M-step (generalised EM: 100-200 is usually enough because
mstep_trans_iters: 1000     #   each M-step warm-starts from the previous one; 1000 = original)
max_train_seqs: null        # e.g. 400: per-fold representative subsample (per-animal share + length quantiles,
max_test_seqs: null         #   fixed per fold across K / runs). null = all sequences.
temps_init: null            # default all 1
temps_final: 1.0          # default [0.01, 1, ...]
use_init_reward: False
run_s2: True                # S-2 is the cost driver: if the pilot is > 3x S-1, run S-2 only at K <= K* + 1
s2_max_dense_entries: 2.0e+8
cache_fold_inputs: True
s2_index_emissions: True     # S-2 emissions from int indices (x*M+slot) instead of dense (N,T,S*M) one-hots; same LLs,
                             # far less GPU memory. False = previous dense one-hots
overwrite: True            # False = skip folds whose outputs exist (resume)

# get_stats* loops (K in [min_latent, max_latent] inclusive). K = 1 is the no-switching reference.
# Extend to 6 only if test LL at K = 5 is > 1 SEM above K = 4.
min_latent: 2
max_latent: 5
num_runs: 3

run_arhmm: False            # ARHMM sweep runs via get_stats (Phase B1)
run_swirl_init: True
run_swirl_final: True
