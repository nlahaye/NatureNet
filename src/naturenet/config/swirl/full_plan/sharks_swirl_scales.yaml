# Full plan, Phase C: decision scales at K* (same data / folds as Phase B).
#   python -m naturenet.models.irl.run_swirl_kfold        -y full_plan/sharks_swirl_scales.yaml   # ARHMM init + S-1/S-2 refs (run_arhmm True)
#   python -m naturenet.models.irl.run_swirl_scales_kfold -y full_plan/sharks_swirl_scales.yaml --check
#   python -m naturenet.models.irl.run_swirl_scales_kfold -y full_plan/sharks_swirl_scales.yaml [--fold k] [--variant ...]
#   python -m naturenet.models.irl.plot_swirl_scales      -y full_plan/sharks_swirl_scales.yaml
# --- shared data block (identical in every full_plan shark config -> comparable LLs, shared folds) ---
n_states: 75                # = n_clusters of the abstract env (n_clusters + 1 if invalid_state: absorbing)
actions: "/mnt/data/NatureNet/Hammerhead_Out_v1/hammerhead_v1_*_actions.pkl"
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/mnt/data/NatureNet/Hammerhead_Out_v1/"
df_run_uid: "hammerhead_v1"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 49                 # chunk windows: long enough for durations (D <= 20) and regimes. Must be <= the
                            # preprocessing cap max_segment_len (49 for the existing pkls; 60 gave 0 sequences)
segment_policy: "chunk"     # or "variable": one sequence per valid run, seq_len = MAX length (runs split into
                            # near-equal pieces; null = no cap), padded + masked (exact LLs). Not for NN-SWIRL.
# min_seq_len: 10           # variable only: drop runs shorter than this (default 3); set >= 3 * max_duration
n_folds: 5
fold_seed: 0
folds_dir: "/mnt/data/NatureNet/Hammerhead_Out_v1/folds/"     # one fold file for ARHMM, SWIRL, NN-SWIRL, HIAVI and decision scales
# --- end shared data block ---
# SWIRL decision-scale variants (swirl_scales / run_swirl_scales_kfold). Same data, folds, per-fold T and ARHMM
# init as run_swirl_kfold; every toggle defaults to off (order 1 + all off = SWIRL S-1).
#   python -m naturenet.models.irl.run_swirl_scales_kfold -y swirl_scales.yaml --check      # segment / context report
#   python -m naturenet.models.irl.run_swirl_scales_kfold -y swirl_scales.yaml [--fold 0]
#   python -m naturenet.models.irl.plot_swirl_scales      -y swirl_scales.yaml
# ARHMM init: run run_swirl_kfold with run_arhmm: True on this YAML first (or scales.init: sticky).

seed: 12345
n_hidden_init: 3            # = K* from Phase B (edit)
n_hidden: 3                 # = K* from Phase B (edit)
emission_dim: 1
latent_state_dim: 1
out_dir: "/mnt/data/NatureNet/Hammerhead_Out_v1/scales/"
run_uid: "SWIRL_SCALES"



# Durations and regimes need long sequences: max_duration <= T / 2 and several regime switches per sequence.
# All variants in one sweep share seq_len, so their LLs are comparable. Run --check before choosing.

folds_to_run: null
holdout_fraction: 0.2

epochs: 50                  # stage 1 (no temperature)
epochs_2: 30                # stage 2 (temps_final)
em_tol: 1.0e-5
temps_final: null           # default [0.01, 1, ...]
run_arhmm: True             # run_swirl_kfold on this YAML writes the per-fold ARHMM init (scales.init auto)
run_swirl_init: True        # run_swirl_kfold on this YAML: S-1 / S-2 reference fits at K* (same folds / seq_len)
run_swirl_final: True
run_s2: True
epochs_init: 50
epochs_init_2: 30
overwrite: False

# kinematics: {enabled: True, step_feature: "speed_kmh", min_dt_h: 0.5}   # optional; LL = comparable LL

scales:
  init: "auto"              # arhmm | sticky | auto (ARHMM file if present)
  warm_start: True          # order N starts from the fitted order N-1 with the same latent layers (stage 2 only)
  warm_epochs: 30
  reward_param: "additive"  # additive (state reward + history increments) | free (S-2 layout)
  reward_l2: 1.0            # Gaussian prior on depth-k increments, precision ~ 2 * reward_l2 * (k - 1) (per step)
  context_min_count: 5      # prune k-grams (k >= 2) seen < 5 times in the training animals
  context_source: "train"   # train | all
  context_t_support: False  # True + reward_param free + order 2 reproduces S-2
  reward_optimizer: "auto"  # BFGS up to 3000 reward parameters, else L-BFGS-B
  reward_tol: null          # null -> 1e-4 at order 1 (matches SWIRL), 1e-8 at order > 1 (deep contexts need it)

  # Settings used when a layer is "on" in the grid (a dict in the grid / variants overrides them).
  defaults:
    switch_history: {kind: "lags+decay", lags: 2, decay_steps: [3, 10], window: 10}
    durations: {hazard: "logistic", max_duration: 20, hazard_features: False, smooth: 1.0, l2: 1.0}
    hierarchy: {n_regimes: 2, sticky: 0.95, prior: 0.0, init_noise: 0.5}

  # Stage A (nested layers at order 1) and the order sweep on the baseline. Order N = context depth:
  # reward on N-grams, action choice depends on the last N-1 states (N = 2 is S-2: transition reward only).
  grid:
    order: [1, 2, 3]          # add 4 only if N3 is N* (within 1 SE of the best)
    switch_history: ["off"]
    durations: ["off"]
    hierarchy: ["off"]
  variants:
    - {switch_history: "on"}
    - {durations: "on"}
    # - {durations: {hazard: "nonparametric", smooth: 5.0}}     # only if the logistic hazard is kept (shape check)
    - {hierarchy: "on"}
    - {switch_history: "on", durations: "on"}
    # - {switch_history: "on", durations: "on", hierarchy: "on"}   # only if >= 2 single layers are kept
  # Stage B (after A): add the best latent configuration crossed with order, e.g.
  #   - {order: 2, durations: "on"}
  #   - {order: 3, durations: "on"}
