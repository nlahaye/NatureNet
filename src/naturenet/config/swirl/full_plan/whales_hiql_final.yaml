# Final single-animal HIQL (HIAVI) fit (whales, K = 3) for maps, time series and reward projection.
#   python -m naturenet.models.irl.run_hiavi_kfold        -y full_plan/whales_hiql_final.yaml --holdout
#   python -m naturenet.models.irl.plot_hiavi             -y full_plan/whales_hiql_final.yaml
#   python -m naturenet.models.irl.reward_env_projection  -y full_plan/whales_hiql_final.yaml -p full_plan/whales_reward_env_projection.yaml --n_hidden 3   (set model: hiavi in the -p file)
# Same data block and HIAVI settings as the Phase B CV. Check n_states / actions against the Phase B YAML you ran.
# --- shared data block (identical in every full_plan whale config -> comparable LLs, shared folds) ---
n_states: 75                # TODO: whale abstract-env n_clusters (+1 if invalid_state: absorbing)
actions: "/data/nlahaye/NatureNet/Blue_Whale_v1/SWIRL_WHALE_v1_*_actions.pkl"   # originals + __aug copies
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/"
df_run_uid: "SWIRL_WHALE_v1"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy (= Phase B / C): one sequence per valid run, runs > 60 split into
segment_policy: "variable"  # near-equal pieces, padded + masked (exact LLs)
min_seq_len: 10             # = Phase B / C
n_folds: 5                  # 23 animals -> 4-5 per test fold (folds group by base id, so __aug copies stay together)
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/folds/"   # one fold file for ARHMM, SWIRL, HIAVI and decision scales
# --- end shared data block ---


seed: 12345                 # base seed; get_stats_hiavi runs use seed + run index
n_hidden_init: 3
n_hidden: 3
out_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/final/hiql/"
run_uid: "WHALE_HIQL_FINAL"

holdout_fraction: 0.0   # train on every animal
overwrite: False

hiavi_discount: 0.9
hiavi_restarts: 10          # best restart by TRAIN LL
hiavi_mstep: "soft"
hiavi_pseudocount: 0.5
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"        # s = states[:, 1:-1], comparable to SWIRL
run_hiavi_kfold: False
run_hiavi_final: True


lon_bounds: [-126, -110]
lat_bounds: [22, 40]
splits: ["train"]
plot_trajs: True
plot_gifs: False
plot_inputs: False
input_keys: []
static_layers: {}
reward_normalize: "none"
hiavi_plot_series: True
hiavi_cv_plot: False   # CV curves come from the Phase B dir / plot_ll_comparison
plot_dir: "/data/nlahaye/NatureNet/Blue_Whale_v1/final/hiql/plots/"
