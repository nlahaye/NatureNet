# Sharks v2 pipeline manifest (runbook steps 1-15): what each step writes, for the manifest auditor.
#   python -m naturenet.drivers.audit --manifest config/v2/audit/sharks_pipeline.yaml --steps 1-15
# Paths come from the run configs ({cfg.<alias>.<key>}) wherever a config holds them, so a changed out_dir /
# run_uid is picked up automatically. Override any var with --set NAME=value (e.g. --set MS_DOCX=/path/x.docx).
# Action-only runs (steps 5, 6, 7-ao) are the LL-table baselines; the kinematic tools (5b, 6b, 7-14) are primary.
name: sharks v2 (steps 1-15)
out: "{R}/audit_pipeline/"
vars:
  SP: sharks
  R: /data/nlahaye/NatureNet/Hammerhead_Out_v2
  UID: hammerhead_v2
  CM: /data/nlahaye/NatureNet_Env/Copernicus/v2/sharks
  SF: /data/nlahaye/output/Learnergy/COP_SHARK_V2
  LS: /data/nlahaye/NatureNet/launcher
  SHIP: "{cfg.cmems.ship_density.0.path}"   # read from the CMEMS build config that made the static layers (--set SHIP=... overrides)
  N_ANIMALS: "1"                  # exported shark series expected in step 8 (set to the animal count)
  MS_DOCX: /data/nlahaye/NatureNet/manuscript/Movement_Paper_MEE_updated_v6.docx
configs:
  cmems: config/environment/cmems_env_sharks.yaml
  swirl_kfold: config/v2/swirl/sharks_swirl_kfold_pc1T_t1.yaml
  hiavi_kfold: config/v2/swirl/sharks_hiavi_kfold.yaml
  iavi_kfold: config/v2/swirl/sharks_iavi_kfold.yaml
  ll_cmp: config/v2/swirl/sharks_ll_comparison.yaml
  swirl_kin: config/v2/swirl/sharks_swirl_kfold_kin.yaml
  hiavi_kin: config/v2/swirl/sharks_hiavi_kfold_kin.yaml
  ll_kin: config/v2/swirl/sharks_ll_comparison_kin_nn.yaml
  sc_swirl: config/v2/swirl/sharks_swirl_scales.yaml
  sc_hiql: config/v2/swirl/sharks_hiql_scales.yaml
  sc_hiql_kin: config/v2/swirl/sharks_hiql_scales_kin_k5.yaml
  sc_hiql_kin2: config/v2/swirl/sharks_hiql_scales_kin_k2.yaml
  sc_swirl_kin: config/v2/swirl/sharks_swirl_scales_kin.yaml
  fin_hiql: config/v2/swirl/sharks_hiql_final_kin_k5.yaml
  fin_hiql2: config/v2/swirl/sharks_hiql_final_kin_k2.yaml
  fin_swirl: config/v2/swirl/sharks_swirl_final_kin_k5.yaml
  fin_swirl_ao: config/v2/swirl/sharks_swirl_final.yaml
  fin_hiql_ao: config/v2/swirl/sharks_hiql_final.yaml
  fin_iavi_ao: config/v2/swirl/sharks_iavi_final.yaml
  ma_kin: config/v2/swirl/sharks_multiagent_kin.yaml
  ma_sc_kin: config/v2/swirl/sharks_scales_multiagent_kin.yaml
  ma_swirl_kin: config/v2/swirl/sharks_multiagent_swirl_kin.yaml
  ma_sc_swirl_kin: config/v2/swirl/sharks_scales_multiagent_swirl_kin.yaml
  ts_kin: config/v2/time_series/sharks_correlation_final_kin_v2.yaml

checks:
  - {name: sequences, files: ["config/v2/swirl/sharks_*.yaml"], when: df_dir,
     expect: {seq_len: 60, segment_policy: variable, min_seq_len: 10}}
  - {name: cv_grid, files: ["config/v2/swirl/sharks_*kfold*kin*.yaml"], when: min_latent, expect: {min_latent: 1}}
  - {name: cv_grid_action_only, files: ["config/v2/swirl/sharks_*kfold.yaml", "config/v2/swirl/sharks_*kfold_pc1T_t1.yaml"],
     when: min_latent, expect: {min_latent: 1}, level: warning}
  - {name: v2_paths, files: ["config/v2/swirl/sharks_*.yaml", "config/v2/environment/sharks_*.yaml",
                             "config/v2/time_series/sharks_*.yaml"], absent: ["/mnt/data"]}

steps:
  - id: 1a
    title: Static inputs (ship density)
    outputs:
      - {path: "{SHIP}", ref: false}
      - {path: "{cfg.cmems.work_dir}/static.zarr", ref: false}   # ship density as assembled into the static layers
  - id: 1b
    title: CMEMS scenes
    after: [1a]
    outputs:
      - {path: "{CM}/cop_env_{SP}_t*.zarr", min: 100}
      - path: "{CM}/{SP}_scene_index.csv"
        level: warning
        csv: {expr: "df['complete'].astype(str).str.lower().isin(['true', '1']).mean() >= 0.9"}
      - {path: "{CM}/{SP}_env_meta.json"}
      - {path: "{CM}/{SP}_water_mask.tif"}
      - {path: "{CM}/{SP}_sitfuse_data_block.yaml"}
    note: "scene index: warns if fewer than 90% of days are complete"
  - id: 2a
    title: SIT-FUSE split, encoder, heads, clusters
    after: [1b]
    outputs:
      - {path: "{SF}/scene_split/{SP}_scene_split_summary.json"}
      - path: "{SF}/**/child_heads_manifest.csv"
        level: warning
        csv: {expr: "'routing_ok' not in df or df['routing_ok'].min() >= 1.0"}
      - {path: "{SF}/cop_env_{SP}_t*.zarr.clust.data_*clusters.no_geo.tif", min: 100}
      - {path: "{SF}/**/train_sample_report.json", optional: true}
  - id: 2b
    title: SIT-FUSE seed variants
    after: [2a]
    outputs:
      - {path: "{SF}_seed*", min: 4}
      - {path: "{SF}_seed*/cop_env_{SP}_t*.zarr*clust.data_*clusters*.tif", min: 4}
  - id: 3a
    title: Movement preprocessing
    outputs:
      - {path: "{R}/{UID}_dfs.pkl"}
      - {path: "{R}/{UID}_*_actions.pkl"}
  - id: 3b
    title: Cluster maps along tracks
    after: [2a, 3a]
    outputs:
      - {path: "{R}/env_clusters/final_env_maps_{UID}.pkl"}
  - id: 3c
    title: Sync K-dependent config values
    after: [3b]
    checks:
      - {name: synced, files: ["config/v2/swirl/sharks_*.yaml"], when: df_dir, not_null: [n_states]}
  - id: 3d
    title: Abstract-state trajectories
    after: [3b]
    outputs:
      - {path: "{R}/{UID}_*_states_abstract_env.pkl"}
      - {path: "{R}/{UID}_trans_prob_abstract_env.npz"}
  - id: 3e
    title: Raw inputs at each fix
    after: [1b, 3a]
    outputs:
      - {path: "{R}/{UID}_*_states_input.pkl"}
      - {path: "{R}/{UID}_states_input_channels.json"}
  - id: 4
    title: Input checks
    optional: true
    after: [3d, 3e]
    outputs:
      - {path: "/tmp/ci2/{SP}.csv", optional: true}
    note: report-only step (written to /tmp)
  - id: 5
    title: Action-only K selection (baselines)
    after: [3c, 3d, 3e]
    plan: {path: "{LS}/{SP}_plan.yaml", jobs: ["swirl.*", "hiavi.*", "iavi.*"], optional: true}
    outputs:
      - path: "{cfg.swirl_kfold.out_dir}/{cfg.swirl_kfold.run_uid}_loop_0_latent_*_states_*_{cfg.swirl_kfold.seed}_naturenet_S1_iter2_LL1_test_KF_*.npz"
        min: "({cfg.swirl_kfold.max_latent} - {cfg.swirl_kfold.min_latent} + 1) * {cfg.swirl_kfold.n_folds}"
      - path: "{cfg.swirl_kfold.out_dir}/{cfg.swirl_kfold.run_uid}_loop_0_latent_*_states_*_{cfg.swirl_kfold.seed}_naturenet_S2_iter2_LL2_test_KF_*.npz"
        min: "({cfg.swirl_kfold.max_latent} - {cfg.swirl_kfold.min_latent} + 1) * {cfg.swirl_kfold.n_folds}"
      - path: "{cfg.hiavi_kfold.out_dir}/ll_hiavi.csv"
        csv: {where: "run_uid == '{cfg.hiavi_kfold.run_uid}' or run_uid.str.startswith('{cfg.hiavi_kfold.run_uid}_loop_')",
              cover: {K: "range({cfg.hiavi_kfold.min_latent}, {cfg.hiavi_kfold.max_latent} + 1)",
                      fold: "range({cfg.hiavi_kfold.n_folds})"}}
      - path: "{cfg.iavi_kfold.out_dir}/ll_hiavi.csv"
        csv: {where: "run_uid == '{cfg.iavi_kfold.run_uid}' or run_uid.str.startswith('{cfg.iavi_kfold.run_uid}_loop_')", cover: {fold: "range({cfg.iavi_kfold.n_folds})"}}
      - {path: "{cfg.ll_cmp.out_dir}/{cfg.ll_cmp.out_prefix}_ll_summary.csv"}
  - id: 5b
    title: Kinematic baselines
    after: [3c, 3d, 3e]
    plan: {path: "{LS}/{SP}_kin_plan.yaml", optional: false}
    outputs:
      - path: "{cfg.swirl_kin.out_dir}/{cfg.swirl_kin.run_uid}_loop_0_latent_*_states_*_{cfg.swirl_kin.seed}_naturenet_S2_iter2_LL2_test_KF_*.npz"
        min: "({cfg.swirl_kin.max_latent} - {cfg.swirl_kin.min_latent} + 1) * {cfg.swirl_kin.n_folds}"
      - path: "{cfg.hiavi_kin.out_dir}/ll_hiavi.csv"
        csv: {where: "run_uid == '{cfg.hiavi_kin.run_uid}' or run_uid.str.startswith('{cfg.hiavi_kin.run_uid}_loop_')",
              cover: {K: "range({cfg.hiavi_kin.min_latent}, {cfg.hiavi_kin.max_latent} + 1)",
                      fold: "range({cfg.hiavi_kin.n_folds})"}}
      - {path: "{cfg.ll_kin.out_dir}/{cfg.ll_kin.out_prefix}_ll_summary.csv"}
  - id: 6
    title: Action-only decision scales
    optional: true
    after: [5]
    outputs:
      - {path: "{cfg.sc_swirl.out_dir}/{cfg.sc_swirl.run_uid}_scales_summary.csv"}
      - {path: "{cfg.sc_hiql.out_dir}/{cfg.sc_hiql.run_uid}_scales_summary.csv"}
  - id: 6b
    title: Kinematic decision scales
    after: [5b]
    plan: {path: "{LS}/scales_kin_tools.yaml", jobs: ["scales.*sharks*"], optional: false}
    outputs:
      - path: "{cfg.sc_hiql_kin.out_dir}/{cfg.sc_hiql_kin.run_uid}_scales_cv.csv"
        csv: {per: variant, cover: {fold: "range({cfg.sc_hiql_kin.n_folds})"}}
      - path: "{cfg.sc_swirl_kin.out_dir}/{cfg.sc_swirl_kin.run_uid}_scales_cv.csv"
        csv: {per: variant, cover: {fold: "range({cfg.sc_swirl_kin.n_folds})"}}
      - path: "{cfg.sc_hiql_kin2.out_dir}/{cfg.sc_hiql_kin2.run_uid}_scales_cv.csv"
        optional: true
        csv: {per: variant, cover: {fold: "range({cfg.sc_hiql_kin2.n_folds})"}}
      - {path: "{cfg.sc_hiql_kin.out_dir}/{cfg.sc_hiql_kin.run_uid}_scales_summary.csv"}
      - {path: "{cfg.sc_swirl_kin.out_dir}/{cfg.sc_swirl_kin.run_uid}_scales_summary.csv"}
      - {path: "{cfg.sc_hiql_kin2.out_dir}/{cfg.sc_hiql_kin2.run_uid}_scales_summary.csv", optional: true}
    note: "summaries come from run_scales_kfold.sh STAGE=plots"
  - id: 7
    title: Final fits (kinematic tools)
    after: [5b]
    outputs:
      - {path: "{cfg.fin_hiql.out_dir}/{cfg.fin_hiql.run_uid}_{cfg.fin_hiql.n_hidden}_{cfg.fin_hiql.seed}_hiavi.npz"}
      - {path: "{cfg.fin_hiql.out_dir}/{cfg.fin_hiql.run_uid}_{cfg.fin_hiql.n_hidden}_{cfg.fin_hiql.seed}_hiavi_kinematics.csv", optional: true}
      - {path: "{cfg.fin_swirl.out_dir}/{cfg.fin_swirl.run_uid}_{cfg.fin_swirl.n_hidden}_{cfg.fin_swirl.seed}_S1_naturenet_iter2*.npz"}
      - {path: "{cfg.fin_swirl.out_dir}/{cfg.fin_swirl.run_uid}_{cfg.fin_swirl.n_hidden}_{cfg.fin_swirl.seed}_S2_naturenet_iter2.npz", optional: true}
      - {path: "{cfg.fin_hiql2.out_dir}/{cfg.fin_hiql2.run_uid}_{cfg.fin_hiql2.n_hidden}_{cfg.fin_hiql2.seed}_hiavi.npz", optional: true}
      - {path: "{cfg.fin_hiql2.out_dir}/{cfg.fin_hiql2.run_uid}_{cfg.fin_hiql2.n_hidden}_{cfg.fin_hiql2.seed}_hiavi_kinematics.csv", optional: true}
  - id: 7-ao
    title: Final fits (action-only, comparison figures)
    optional: true
    after: [5]
    outputs:
      - {path: "{cfg.fin_swirl_ao.out_dir}/{cfg.fin_swirl_ao.run_uid}_{cfg.fin_swirl_ao.n_hidden}_{cfg.fin_swirl_ao.seed}_S*_naturenet_iter2*.npz"}
      - {path: "{cfg.fin_hiql_ao.out_dir}/{cfg.fin_hiql_ao.run_uid}_{cfg.fin_hiql_ao.n_hidden}_{cfg.fin_hiql_ao.seed}_hiavi.npz"}
      - {path: "{cfg.fin_iavi_ao.out_dir}/{cfg.fin_iavi_ao.run_uid}_*.npz"}
  - id: 8
    title: Maps, tracks and series export
    after: [7]
    outputs:
      - {path: "{cfg.fin_hiql.plot_dir}/series_hiavi_s1/*_time_series_pd.*", min: "{N_ANIMALS}"}
      - {path: "{cfg.fin_hiql.plot_dir}/state_reward_hiavi_s1.npy"}
      - {path: "{cfg.fin_swirl.plot_dir}/series_linear_s1/*_time_series_pd.*", min: "{N_ANIMALS}"}
      - {path: "{cfg.fin_swirl.plot_dir}/series_linear_s2/*_time_series_pd.*", min: "{N_ANIMALS}", optional: true}
      - {path: "{cfg.fin_swirl.plot_dir}/state_reward_linear_s1.npy"}
      - {path: "{cfg.fin_hiql2.plot_dir}/series_hiavi_s1/*_time_series_pd.*", min: "{N_ANIMALS}", optional: true}
      - {path: "{cfg.fin_hiql2.plot_dir}/state_reward_hiavi_s1.npy", optional: true}
    note: "min = N_ANIMALS series (set --set N_ANIMALS=<n>)"
  - id: 9
    title: SIT-FUSE interpretation (XAI)
    after: [2a]
    outputs:
      - {path: "{SF}/xai/interpret/cluster_profiles_wide.csv"}
      - {path: "{SF}/xai/**/*shap*", optional: true}
  - id: 10
    title: Exploit / explore labels
    after: [8]
    outputs:
      - {path: "{R}/final/exploit_explore/*hiql_kin_k5/*_exploit_explore.csv", min: 2}
      - {path: "{R}/final/exploit_explore/*swirl_kin_s1_k5/*_exploit_explore.csv", min: 2}
      - {path: "{R}/final/exploit_explore/*swirl_kin_s2_k5/*_exploit_explore.csv", optional: true}
      - {path: "{R}/final/exploit_explore/*hiql_kin_k2/*_exploit_explore.csv", min: 2, optional: true}
    note: "series slice full + the fitted-kinematics file"
  - id: 11
    title: Reward-to-environment projection
    after: [8, 9]
    outputs:
      - {path: "{cfg.fin_hiql.out_dir}/reward_env_projection/reward_projection_coefficients.csv"}
      - {path: "{cfg.fin_swirl.out_dir}/reward_env_projection_s1/reward_projection_coefficients.csv"}
      - {path: "{cfg.fin_swirl.out_dir}/reward_env_projection_s2/reward_projection_coefficients.csv", optional: true}
      - {path: "{cfg.fin_hiql2.out_dir}/reward_env_projection/reward_projection_coefficients.csv", optional: true}
  - id: 11h
    title: Habitat tests by mode (fronts / eddies, lags, seasons)
    after: [8, 11]
    optional: true
    outputs:
      - path: "{R}/drivers/habitat_tests/feature_use.csv"
        csv: {expr: "df['tool'].eq('hiql_kin_k5').any() and df['tool'].eq('swirl_kin_s1_k5').any()"}
      - path: "{R}/drivers/habitat_tests/season_contrast.csv"
        csv: {expr: "df['tool'].eq('hiql_kin_k5').any() and df['tool'].eq('swirl_kin_s1_k5').any()"}
      - {path: "{R}/drivers/habitat_tests/scene_feature_stats.csv"}
      - {path: "{cfg.fin_hiql.out_dir}/reward_env_projection_season/use_availability_by_group.csv", optional: true}
      - {path: "{cfg.fin_swirl.out_dir}/reward_env_projection_s1_season/use_availability_by_group.csv", optional: true}
    note: "analyses 1 and 3 of the literature comparison (fronts / eddies, wet vs dry season); scales-independent"
  - id: 12
    title: Time-series analysis
    after: [8]
    outputs:
      - {path: "{cfg.ts_kin.out_dir}/hiql_kin/plots/series_hiavi_s1/full/correlation_results.csv"}
      - {path: "{cfg.ts_kin.out_dir}/swirl_kin/plots/series_linear_s1/full/correlation_results.csv"}
      - {path: "{cfg.ts_kin.out_dir}/swirl_kin/plots/series_linear_s2/full/correlation_results.csv", optional: true}
      - {path: "{cfg.ts_kin.out_dir}/hiql_kin_k2/plots/series_hiavi_s1/full/correlation_results.csv", optional: true}
  - id: 13
    title: Manuscript tables
    after: [5, 5b, 6b, 14]
    outputs:
      - {path: "{R}/manuscript_kin/ms_{SP}_kin_T1_baselines.csv"}
      - {path: "{R}/manuscript_kin/ms_{SP}_kin_T2_scales.csv"}
      - {path: "{R}/manuscript_kin/ms_{SP}_kin_T3_multiagent.csv"}
      - {path: "{R}/manuscript_kin/ms_{SP}_kin_tables.md"}
      - {path: "{R}/manuscript_kin/ma_compare_kin.csv"}
  - id: 14
    title: Multi-agent (kinematic tools)
    after: [5b]
    plan: {path: "{LS}/ma_kin_tools_full.yaml", jobs: ["*sharks*"], optional: false}
    outputs:
      - path: "{cfg.ma_kin.out_dir}/{cfg.ma_kin.multiagent.ma_subdir}/ma_summary.json"
        json: {expr: "{'5', '2'} <= set(d['K'])"}
      - path: "{cfg.ma_kin.out_dir}/{cfg.ma_kin.multiagent.ma_subdir}/ma_cv.csv"
        csv: {expr: "(df['null_id'] >= 0).any()"}
      - {path: "{cfg.ma_kin.out_dir}/{cfg.ma_kin.multiagent.ma_subdir}/ma_final_K[25].npz", min: 2}
      - {path: "{cfg.ma_kin.out_dir}/{cfg.ma_kin.multiagent.ma_subdir}/plots/ma_results_K[25].csv", min: 2}
      - {path: "{cfg.ma_sc_kin.out_dir}/ma_scales_summary.csv"}
      - {path: "{cfg.ma_sc_kin.out_dir}/ma_scales_plots/*", optional: true}
      - path: "{cfg.ma_swirl_kin.out_dir}/{cfg.ma_swirl_kin.multiagent.ma_subdir}/ma_summary.json"
        json: {expr: "'5' in d['K']"}
      - {path: "{cfg.ma_swirl_kin.out_dir}/{cfg.ma_swirl_kin.multiagent.ma_subdir}/ma_final_K5.npz"}
      - {path: "{cfg.ma_sc_swirl_kin.out_dir}/multiagent_swirl_scales_S1_N1/ma_final_K5.npz", optional: true}
    note: "ma_cv.csv without null rows = screen only (STAGE=full not run); SWIRL rows = run_shark_swirl_kin.sh STAGE=ma"
  - id: 15
    title: Manuscript update
    manual: true
    after: [13]
    outputs:
      - {path: "{MS_DOCX}", optional: true}
    note: "edit by hand once 1-14 and 18 are done; set --set MS_DOCX=<path>"
