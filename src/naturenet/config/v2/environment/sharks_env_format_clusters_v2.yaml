# SIT-FUSE v2 cluster maps along the sharks tracks -> /data/nlahaye/NatureNet/Hammerhead_Out_v2/env_clusters/final_env_maps_hammerhead_v2.pkl
#   python -m naturenet.models.feature_rep.env_data_format -y config/v2/environment/sharks_env_format_clusters_v2.yaml
# Writes the class mapper final_env_maps__class_mapper.pkl (K valid clusters -> n_clusters = K, n_states = K + 1).
df_uid: "hammerhead_v2"
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/"
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/env_clusters/"
output_uid: "final_env_maps_"
# Calendar from the cmems_env scene index (no start_time / n_days); t = {i} in the file names
scene_index_csv: "/data/nlahaye/NatureNet_Env/Copernicus/v2/sharks/sharks_scene_index.csv"
complete_scenes_only: True
scene_file_template: "/data/nlahaye/output/Learnergy/COP_SHARK_V2/cop_env_sharks_t{i}.zarr.clust.data_*clusters.no_geo.tif"
allow_missing_scenes: False   # True only if SIT-FUSE inference skipped some scenes (they become the absorbing state)
nearest_scene_days: 0
strict_scene_coverage: True
mask_path: "/data/nlahaye/NatureNet_Env/Copernicus/v2/sharks/sharks_water_mask.tif"           # cmems_env water mask on the scene grid (1 = water, relaxed coast)
land_value: 0
land_fill: -1
sit_fuse_output: True
cluster_scale: 1000          # id = rint(value * 1000)
zero_label_valid: True      # id 0 is a real cluster (SIT-FUSE no data is negative); v1 dropped it
cluster_level: fine         # fine (heir) baseline; parent / coarse levels: config/v2/levels/
