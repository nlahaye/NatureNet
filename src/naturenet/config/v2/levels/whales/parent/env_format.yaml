# Environment level parent: parent (first-stage) clusters. Generated by naturenet.environment.make_level_configs from
# config/v2/environment/whales_env_format_clusters_v2.yaml (whales_levels_v2.yaml); edit the spec or template and regenerate.
# SIT-FUSE v2 cluster maps along the whales tracks -> /data/nlahaye/NatureNet/Blue_Whale_v2/env_clusters/final_env_maps_SWIRL_WHALE_v1.pkl
#   python -m naturenet.models.feature_rep.env_data_format -y config/v2/environment/whales_env_format_clusters_v2.yaml
# Writes the class mapper final_env_maps__class_mapper.pkl (K valid clusters -> n_clusters = K, n_states = K + 1).
df_uid: "SWIRL_WHALE_v1"
df_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/levels/parent/"
out_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/levels/parent/env_clusters/"
output_uid: "final_env_maps_"
# Calendar from the cmems_env scene index (no start_time / n_days); t = {i} in the file names
scene_index_csv: "/data/nlahaye/NatureNet_Env/Copernicus/v2/whales/whales_scene_index.csv"
complete_scenes_only: True
scene_file_template: "/data/nlahaye/output/Learnergy/COP_WHALE_V2/cop_env_whales_t{i}.zarr.clust.data_*clusters.no_geo.tif"
allow_missing_scenes: False   # True only if SIT-FUSE inference skipped some scenes (they become the absorbing state)
nearest_scene_days: 0
strict_scene_coverage: True
mask_path: "/data/nlahaye/NatureNet_Env/Copernicus/v2/whales/whales_water_mask.tif"           # cmems_env water mask on the scene grid (1 = water, relaxed coast)
land_value: 0
land_fill: -1
sit_fuse_output: True
cluster_scale: 1000          # id = rint(value * 1000)
zero_label_valid: True   # id 0 is a real cluster
cluster_level: "parent"   # level
label_input: "fine"   # level
num_child: 5   # SIT-FUSE cluster.heir.num_classes
unmapped_parent: "error"   # level
