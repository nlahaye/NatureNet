# Multi-scale SIT-FUSE environment levels for the whales (fine = heir baseline in config/v2/environment + config/v2/swirl).
#   python -m naturenet.environment.make_level_configs -y config/v2/levels/whales_levels_v2.yaml [--dry_run]
# -> config/v2/levels/whales/<level>/{link, env_format, abstract_env, sync, <runs>}.yaml + ll_comparison_levels.yaml
# The seascape level needs the Seascapes rasters first (naturenet.environment.seascapes all).
# Choose the coarse K values from <SIT-FUSE out>/hierarchy/cut_summary.csv (sit_fuse cluster_hierarchy build) and
# regenerate. Every coarse k must be one of the hierarchy ks.
out_config_dir: config/v2/levels/whales        # relative to the naturenet package dir
base_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/"          # v2 fine run (movement files are symlinked from here)
levels_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/levels/"
df_run_uid: "SWIRL_WHALE_1517"
output_uid: "final_env_maps_"
hierarchy_json: "/data/nlahaye/output/Learnergy/COP_WHALE_V2/hierarchy/cluster_hierarchy.json"
sitfuse_out_dir: "/data/nlahaye/output/Learnergy/COP_WHALE_V2/"
num_child: 5                  # SIT-FUSE cluster.heir.num_classes
label_input: fine             # parent ids = fine // num_child; "parent" reads the no_heir rasters instead
unmapped_parent: error
levels:
  - {name: parent, level: parent}
  - {name: k30, level: coarse, k: 30}
  - {name: k20, level: coarse, k: 20}
  - {name: k12, level: coarse, k: 12}
  # MBON Seascapes baseline (naturenet.environment.seascapes): a published habitat classification as the state space
  - {name: seascape, level: categorical, scene_file_template: "/data/nlahaye/NatureNet_Env/Seascapes/v2/whales/seascape_whales_t{i}.tif",
     cluster_scale: 1, zero_label_valid: False, exclude_classes: [], interpret_subdir: interpret_seascape}
  # Environment-ablation nulls (test 1, naturenet.drivers.env_null): movement unchanged, labels replaced.
  # shift / shuffle / marginal keep the fine K (and the fine cluster profiles); single = one environment state.
  - {name: null_shift, level: "null", mode: shift, seed: 0}
  - {name: null_shuffle, level: "null", mode: shuffle, seed: 0}
  - {name: null_marginal, level: "null", mode: marginal, seed: 0}
  - {name: null_single, level: "null", mode: single, seed: 0, runs: [hiavi_kfold_kin, hiql_scales_kin_k5]}
templates:
  env_format: config/v2/environment/whales_env_format_clusters_v2.yaml
  abstract_env: config/v2/environment/whales_abstract_env_v2.yaml
  sync: config/v2/environment/whales_sync_v2.yaml
runs:                         # generated for every level; which ones to run: see the commands document (step 16)
  hiavi_kfold: config/v2/swirl/whales_hiavi_kfold.yaml            # HIQL K sweep (every level)
  iavi_kfold: config/v2/swirl/whales_iavi_kfold.yaml              # IAVI K = 1 (every level)
  swirl_kfold: config/v2/swirl/whales_swirl_kfold.yaml   # SWIRL S-1 / S-2: best one or two levels only
  hiql_final: config/v2/swirl/whales_hiql_final.yaml              # final fit: chosen level(s) only
  reward_env_projection_hiql: config/v2/swirl/whales_reward_env_projection_hiql.yaml
  # kinematics-enabled tools (environmental-driver tests, config/v2/drivers/whales_drivers.yaml)
  hiavi_kfold_kin: config/v2/swirl/whales_hiavi_kfold_kin.yaml        # HIQL + kin, K = 5 at every level / null
  hiql_scales_kin_k5: config/v2/swirl/whales_hiql_scales_kin_k5.yaml  # decision-scale grid x environment level
  # kinematic levels analysis (scripts/run_levels_kin_v2.sh): HIQL + kin K sweep, SWIRL + kin CV, finals at the
  # best CV K, reward projections. hiql_kfold_kin shares run_uid / out_dir with hiavi_kfold_kin, so its K = 5 folds
  # are reused (the runners skip finished folds); the script sets the K ranges.
  hiql_kfold_kin: config/v2/swirl/whales_hiavi_kfold_kin.yaml           # HIQL + kin K sweep (min_latent 1)
  swirl_kfold_kin: config/v2/swirl/whales_swirl_kfold_kin.yaml          # SWIRL + kin CV (S-1 + S-2)
  hiql_final_kin: config/v2/swirl/whales_hiql_final_kin_k5.yaml         # final fit, n_hidden set by the script
  swirl_final_kin: config/v2/swirl/whales_swirl_s2_final_kin_k5.yaml
  reward_env_projection_swirl_kin: config/v2/swirl/whales_reward_env_projection_s2_kin.yaml
  reward_env_projection_swirl_kin_s1: config/v2/swirl/whales_reward_env_projection_s1_kin.yaml   # S-1 of the same fit
  # multi-agent coupling at the better-fitting levels (scripts/run_multiagent_v2.sh STAGE=levels; screen first,
  # nulls only for the level(s) kept). Mixture + align / matrix forms, K = 5 kin, outputs <level dir>/multiagent/.
  multiagent_kin_coupling: config/v2/swirl/whales_multiagent_kin_coupling.yaml
null_runs: [hiavi_kfold_kin, hiql_scales_kin_k5, reward_env_projection_hiql]   # runs generated for null levels
overrides:
  hiavi_kfold: {run_hiavi_final: False}   # level sweep = CV only; holdout fit via hiql_final at the chosen level
  # K = 5 only across levels (the K sweep with min_latent = 1 stays at the fine level, config/v2/swirl)
  hiavi_kfold_kin: {run_hiavi_final: False, n_hidden: 5, min_latent: 5, max_latent: 5}
  # kinematic levels analysis (CV only; finals via *_final_kin). K ranges are re-set by run_levels_kin_v2.sh.
  hiql_kfold_kin: {run_hiavi_final: False, n_hidden: 5, min_latent: 1, max_latent: 5}
  swirl_kfold_kin: {n_hidden: 5, n_hidden_init: 5, min_latent: 5, max_latent: 5, run_s2: True}
ll_comparison:
  out_prefix: "whale_v2_levels"
  title: "Blue whale K-fold log-likelihood by environment level"
  reference: hiavi            # fine-level HIQL
  fine:                       # yaml relative to out_config_dir
    - {name: hiavi, label: "HIQL fine", yaml: "../../swirl/whales_hiavi_kfold.yaml", color: "#000000"}
    - {name: hiavi, alias: iavi, label: "IAVI fine (K=1)", yaml: "../../swirl/whales_iavi_kfold.yaml", color: "#555555"}
    - {name: swirl_s1, label: "SWIRL S-1 fine", yaml: "../../swirl/whales_swirl_kfold.yaml", color: "#aaaaaa"}
    - {name: swirl_s2, label: "SWIRL S-2 fine", yaml: "../../swirl/whales_swirl_kfold.yaml", color: "#cccccc"}
  per_level:                  # {lv} = level name; run = generated config
    - {name: hiavi, alias: "hiql_{lv}", label: "HIQL {lv}", run: hiavi_kfold}
    - {name: hiavi, alias: "iavi_{lv}", label: "IAVI {lv} (K=1)", run: iavi_kfold}
    - {name: swirl_s1, alias: "swirl_s1_{lv}", label: "SWIRL S-1 {lv}", run: swirl_kfold}
    - {name: swirl_s2, alias: "swirl_s2_{lv}", label: "SWIRL S-2 {lv}", run: swirl_kfold}
    - {name: hiavi, alias: "hiql_kin_{lv}", label: "HIQL+kin {lv}", run: hiql_kfold_kin}   # K sweep (K = 5 shared with hiavi_kfold_kin)
ll_comparisons:               # extra comparison files: <out_config_dir>/ll_comparison_<name>.yaml
  kin:                        # kinematic tools across levels; reference = fine HIQL + kin (same LL scale and family)
    out_prefix: "whale_v2_levels_kin"
    title: "Blue whale K-fold log-likelihood by environment level (kinematic HIQL and SWIRL)"
    reference: hiql_kin
    levels: [parent, k30, k20, k12, seascape]
    fine:
      - {name: hiavi, alias: hiql_kin, label: "HIQL+kin fine", yaml: "../../swirl/whales_hiavi_kfold_kin.yaml", color: "#000000"}
      - {name: swirl_s1, alias: swirl_s1_kin, label: "SWIRL S-1+kin fine", yaml: "../../swirl/whales_swirl_kfold_kin.yaml", color: "#555555"}
      - {name: swirl_s2, alias: swirl_s2_kin, label: "SWIRL S-2+kin fine", yaml: "../../swirl/whales_swirl_kfold_kin.yaml", color: "#aaaaaa"}
    per_level:
      - {name: hiavi, alias: "hiql_kin_{lv}", label: "HIQL+kin {lv}", run: hiql_kfold_kin}
      - {name: swirl_s1, alias: "swirl_s1_kin_{lv}", label: "SWIRL S-1+kin {lv}", run: swirl_kfold_kin}
      - {name: swirl_s2, alias: "swirl_s2_kin_{lv}", label: "SWIRL S-2+kin {lv}", run: swirl_kfold_kin}
