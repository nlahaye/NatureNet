# Environment level k30: coarse level K = 30. Generated by naturenet.environment.make_level_configs from
# config/v2/swirl/sharks_iavi_kfold.yaml (sharks_levels_v2.yaml); edit the spec or template and regenerate.
# v2 environment (CMEMS v2 scenes + new SIT-FUSE clusters). Generated from config/swirl/full_plan/sharks_iavi_kfold.yaml;
# only paths, n_states, input_keys / variables, env_window and the shared sequence settings differ.
# Run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# Full plan, Phase B (sharks): IAVI baseline = single-intention HIAVI (K = 1) on the same data / folds / LL
# definition as the SWIRL, HIAVI and decision-scales runs, so it is the matched K = 1 reference in the LL plots.
#   python -m naturenet.models.irl.run_hiavi_kfold -y v2/swirl/sharks_iavi_kfold.yaml              # 5-fold CV
#   python -m naturenet.models.irl.run_hiavi_kfold -y v2/swirl/sharks_iavi_kfold.yaml --holdout    # final (holdout) fit
#   python -m naturenet.models.irl.plot_hiavi      -y v2/swirl/sharks_iavi_kfold.yaml              # maps / time series
#   python -m naturenet.models.irl.plot_ll_comparison -y v2/swirl/sharks_ll_comparison.yaml   # "IAVI (K=1)" entry
# Outputs: <out_dir>/IAVI_BASE_1_12345_hiavi[_LL[_test]]_KF_<k>.npz and rows (K = 1) in <out_dir>/ll_hiavi.csv.
# With K = 1 the E-step is trivial (EM converges in ~2 iterations), so one restart is enough.
# --- shared data block (identical in every full_plan shark config -> comparable LLs, shared folds) ---
n_states: null   # synced by naturenet.environment.sync_v2_configs (level K + 1 absorbing)
actions: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k30/hammerhead_v2_*_actions.pkl"
positions: "auto"
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k30/"
df_run_uid: "hammerhead_v2"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
segment_policy: "variable"
min_seq_len: 10
n_folds: 5
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/folds/"
# --- end shared data block ---

seed: 12345
n_hidden_init: 1
n_hidden: 1                 # IAVI = one intention
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k30/baselines_hiavi/"
run_uid: "IAVI_BASE_K30"   # level run

folds_to_run: null
holdout_fraction: 0.2
overwrite: False

# IAVI (HIAVI settings, identical to the HIAVI baseline except K and restarts)
hiavi_discount: 0.9
hiavi_restarts: 1
hiavi_mstep: "soft"
hiavi_pseudocount: 0.5      # same smoothing as HIAVI (0 = original hiql: unseen (s, a) -> log 1e-6)
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95          # unused at K = 1
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"        # s = states[:, 1:-1], comparable to SWIRL

# Plots (plot_hiavi)
lon_bounds: [-100, -60]     # = v2 env grid
lat_bounds: [20, 40]
splits: ["train", "test"]
plot_trajs: True
plot_gifs: False
plot_inputs: False
input_keys: []
static_layers: {}
reward_normalize: "none"
hiavi_plot_series: True
hiavi_cv_plot: True
