# Environment level k20: coarse level K = 20. Generated by naturenet.environment.make_level_configs from
# config/v2/swirl/sharks_hiavi_kfold.yaml (sharks_levels_v2.yaml); edit the spec or template and regenerate.
# v2 environment (CMEMS v2 scenes + new SIT-FUSE clusters). Generated from config/swirl/full_plan/sharks_hiavi_kfold.yaml;
# only paths, n_states, input_keys / variables, env_window and the shared sequence settings differ.
# Run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# Full plan, Phase B: HIAVI baseline (same data / folds as sharks_swirl_kfold.yaml), K = 2..5, 3 runs.
#   python -m naturenet.models.irl.get_stats_hiavi -y v2/swirl/sharks_hiavi_kfold.yaml [--n_hidden K] [--run i] [--fold k]
# --- shared data block (identical in every full_plan shark config -> comparable LLs, shared folds) ---
n_states: null   # synced by naturenet.environment.sync_v2_configs (level K + 1 absorbing)
actions: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k20/hammerhead_v1_*_actions.pkl"
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k20/"
df_run_uid: "hammerhead_v1"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
                            # preprocessing cap max_segment_len (49 for the existing pkls; 60 gave 0 sequences)
segment_policy: "variable"
                            # near-equal pieces; null = no cap), padded + masked (exact LLs). Not for NN-SWIRL.
min_seq_len: 10
n_folds: 5
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/folds/"     # one fold file for ARHMM, SWIRL, NN-SWIRL, HIAVI and decision scales
# --- end shared data block ---
# HIAVI K-fold CV / final run / plots on the SWIRL data pipeline.
#   python -m naturenet.models.irl.get_stats_hiavi -y hiavi_kfold.yaml [--n_hidden K] [--run i] [--fold k ...]
#   python -m naturenet.models.irl.run_hiavi_kfold -y hiavi_kfold.yaml [--fold k ...] | --holdout
#   python -m naturenet.models.irl.plot_hiavi      -y hiavi_kfold.yaml

seed: 12345                 # base seed; get_stats_hiavi runs use seed + run index
n_hidden_init: 3
n_hidden: 3                 # K for run_hiavi_kfold / plot_hiavi (get_stats_hiavi sweeps min..max_latent)
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k20/baselines_hiavi/"
run_uid: "HIAVI_BASE_K20"   # level run


# Transitions: per fold from the train animals (no leakage); trans_probs only if per_fold_trans_prob False

# Sequences (same as SWIRL; segment_policy chunk + seq_len for unequal track lengths)

# Folds: same file as the SWIRL / ARHMM runs (point folds_dir at the SWIRL out_dir to share them)
# folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/"
folds_to_run: null
holdout_fraction: 0.2
# holdout_groups: ["183623"]
overwrite: False

# HIAVI
hiavi_discount: 0.9
hiavi_restarts: 10          # best restart by TRAIN LL
hiavi_mstep: "soft"         # soft (deterministic EM) | sample (hiql's stochastic responsibilities)
hiavi_pseudocount: 0.5      # Dirichlet smoothing of per-intention (s, a) counts; 0 = hiql (unseen (s, a) -> log 1e-6, poor test LL)
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95          # initial self-transition weight of the intention chain
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"        # swirl (s = states[:, 1:-1], comparable to SWIRL) | full (s = states[:, :-1])
run_hiavi_kfold: True
run_hiavi_final: False   # level override

# Sweep (get_stats_hiavi)
min_latent: 2
max_latent: 5
num_runs: 3

# Plots / time series (plot_hiavi -> plot_swirl_new.run_plots with swirl_model hiavi)
lon_bounds: [-100, -60]     # = v2 env grid
lat_bounds: [20, 40]
splits: ["train", "test"]
plot_trajs: True
plot_gifs: False
# envs: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/envs.pkl"
# hiavi_env_map: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/env_map.npy"   # (H, W) abstract env states
# env_lon_bounds: [-125, -115]
# env_lat_bounds: [28, 36]
plot_inputs: False
input_keys: []
static_layers: {}
reward_normalize: "none"
hiavi_plot_series: True
hiavi_cv_plot: True
# plot_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/hiavi/plots"
