# Environment level k20: coarse level K = 20. Generated by naturenet.environment.make_level_configs from
# config/v2/swirl/sharks_hiql_final.yaml (sharks_levels_v2.yaml); edit the spec or template and regenerate.
# v2 environment (CMEMS v2 scenes + new SIT-FUSE clusters). Generated from config/swirl/full_plan/sharks_hiql_final.yaml;
# only paths, n_states, input_keys / variables, env_window and the shared sequence settings differ.
# Run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# Final single-animal HIQL (HIAVI) fit (sharks, K = 3) for maps, time series and reward projection.
#   python -m naturenet.models.irl.run_hiavi_kfold        -y v2/swirl/sharks_hiql_final.yaml --holdout
#   python -m naturenet.models.irl.plot_hiavi             -y v2/swirl/sharks_hiql_final.yaml
#   python -m naturenet.models.irl.reward_env_projection  -y v2/swirl/sharks_hiql_final.yaml -p v2/swirl/sharks_reward_env_projection.yaml --n_hidden 3   (set model: hiavi in the -p file)
# Same data block and HIAVI settings as the Phase B CV. Check n_states / actions against the Phase B YAML you ran.
# --- shared data block (identical to the Phase B / C shark configs -> same sequences) ---
n_states: null   # synced by naturenet.environment.sync_v2_configs (level K + 1 absorbing)
actions: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k20/hammerhead_v2_*_actions.pkl"   # originals + __aug copies
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k20/"
df_run_uid: "hammerhead_v2" # step times / positions from <df_dir>/<df_run_uid>_dfs.pkl
per_fold_trans_prob: True   # T from the training animals of each fold
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
segment_policy: "variable"
min_seq_len: 10
n_folds: 5                  # unused by the multi-agent runner (leave-one-animal-out), kept identical
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/folds/"
# --- end shared data block ---


seed: 12345                 # base seed; get_stats_hiavi runs use seed + run index
n_hidden_init: 3
n_hidden: 3
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k20/final/hiql/"
run_uid: "SHARK_HIQL_FINAL_K20"   # level run




holdout_fraction: 0.0   # train on every animal
overwrite: False

hiavi_discount: 0.9
hiavi_restarts: 10          # best restart by TRAIN LL
hiavi_mstep: "soft"         # soft (deterministic EM) | sample (hiql's stochastic responsibilities)
hiavi_pseudocount: 0.5      # Dirichlet smoothing of per-intention (s, a) counts; 0 = hiql (unseen (s, a) -> log 1e-6, poor test LL)
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95          # initial self-transition weight of the intention chain
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"        # swirl (s = states[:, 1:-1], comparable to SWIRL) | full (s = states[:, :-1])
run_hiavi_kfold: False
run_hiavi_final: True


lon_bounds: [-100, -60]     # = v2 env grid
lat_bounds: [20, 40]
splits: ["train"]
plot_trajs: True
plot_gifs: False
# input_keys = input_channels of the v2 sample step; needs <df_dir>/hammerhead_v2_<key>_states_input.pkl from
#   python -m naturenet.environment.sample_env_inputs -y config/v2/environment/sharks_sample_inputs_v2.yaml
# Post-hoc analyses only (series export, plots, correlation, exploit / explore, reward projection): fixes outside
# the environmental scene calendar are dropped. Fixes inside it with no env data (land / nodata) keep the
# absorbing state. Fits / LLs are unchanged (still trained with invalid_state: absorbing). Same calendar as
# config/v2/environment/sharks_sample_inputs_v2.yaml (scene_index_csv / nearest_scene_days).
env_window:
  scene_index_csv: "/data/nlahaye/NatureNet_Env/Copernicus/v2/sharks/sharks_scene_index.csv"   # first .. last complete v2 scene day
  nearest_days: 0
plot_inputs: True
input_keys: ["__run_sync_v2_configs__"]   # synced: = input_channels of the sample_inputs_v2 step
static_layers: {}
reward_normalize: "none"
hiavi_plot_series: True
hiavi_cv_plot: False   # CV curves come from the Phase B dir / plot_ll_comparison
plot_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k20/final/hiql/plots/"
