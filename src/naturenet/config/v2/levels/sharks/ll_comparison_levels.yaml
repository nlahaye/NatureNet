# LL comparison across environment levels (fine = v2 baseline). Generated by make_level_configs.
#   python -m naturenet.models.irl.plot_ll_comparison -y config/v2/levels/sharks/ll_comparison_levels.yaml
# Same folds / sequences / actions at every level, so paired test-LL differences vs `reference` are valid.
# Entries whose runs are missing (e.g. SWIRL at levels where it was not run) are reported and skipped.
out_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/ll_comparison/
out_prefix: hammerhead_v2_levels
title: Hammerhead K-fold log-likelihood by environment level
ci: 0.95
compare_k: null
reference: hiavi
methods:
- name: hiavi
  label: HIQL fine
  yaml: ../../swirl/sharks_hiavi_kfold.yaml
  color: '#000000'
- name: hiavi
  alias: iavi
  label: IAVI fine (K=1)
  yaml: ../../swirl/sharks_iavi_kfold.yaml
  color: '#555555'
- name: swirl_s1
  label: SWIRL S-1 fine
  yaml: ../../swirl/sharks_swirl_kfold_pc1T_t1.yaml
  color: '#aaaaaa'
- name: hiavi
  alias: hiql_parent
  label: HIQL parent
  yaml: parent/hiavi_kfold.yaml
  color: '#ffbb78'
- name: hiavi
  alias: iavi_parent
  label: IAVI parent (K=1)
  yaml: parent/iavi_kfold.yaml
  color: '#2ca02c'
- name: swirl_s1
  alias: swirl_s1_parent
  label: SWIRL S-1 parent
  yaml: parent/swirl_kfold.yaml
  color: '#98df8a'
- name: hiavi
  alias: hiql_k30
  label: HIQL k30
  yaml: k30/hiavi_kfold.yaml
  color: '#d62728'
- name: hiavi
  alias: iavi_k30
  label: IAVI k30 (K=1)
  yaml: k30/iavi_kfold.yaml
  color: '#ff9896'
- name: swirl_s1
  alias: swirl_s1_k30
  label: SWIRL S-1 k30
  yaml: k30/swirl_kfold.yaml
  color: '#9467bd'
- name: hiavi
  alias: hiql_k20
  label: HIQL k20
  yaml: k20/hiavi_kfold.yaml
  color: '#c5b0d5'
- name: hiavi
  alias: iavi_k20
  label: IAVI k20 (K=1)
  yaml: k20/iavi_kfold.yaml
  color: '#8c564b'
- name: swirl_s1
  alias: swirl_s1_k20
  label: SWIRL S-1 k20
  yaml: k20/swirl_kfold.yaml
  color: '#c49c94'
- name: hiavi
  alias: hiql_k12
  label: HIQL k12
  yaml: k12/hiavi_kfold.yaml
  color: '#e377c2'
- name: hiavi
  alias: iavi_k12
  label: IAVI k12 (K=1)
  yaml: k12/iavi_kfold.yaml
  color: '#f7b6d2'
- name: swirl_s1
  alias: swirl_s1_k12
  label: SWIRL S-1 k12
  yaml: k12/swirl_kfold.yaml
  color: '#bcbd22'
