# Environment level k12: coarse level K = 12. Generated by naturenet.environment.make_level_configs from
# config/v2/swirl/sharks_swirl_kfold_pc1T_t1.yaml (sharks_levels_v2.yaml); edit the spec or template and regenerate.
# v2 environment (CMEMS v2 scenes + new SIT-FUSE clusters). Generated from config/swirl/full_plan/sharks_swirl_kfold_pc1T_t1.yaml;
# only paths, n_states, input_keys / variables, env_window and the shared sequence settings differ.
# Run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# Shark SWIRL rerun (Phase B, revised): ARHMM init with pseudo-count 1 on T-reachable moves, temps_final 1.0.
# Changes vs sharks_swirl_kfold.yaml (everything else, incl. the shared data block and folds, is identical):
#   run_uid               SWIRL_BASE -> SWIRL_BASE_pc1T  (reuses the pc1T ARHMM files; base SWIRL files untouched)
#   arhmm_pseudo_count    1.0e-5 -> 1.0
#   arhmm_pseudo_support  null -> "T"
#   temps_final           null ([0.01, 1, ...]) -> 1.0 (every intention at temperature 1)
# Run from src/ (NO --pseudo_count / --pseudo_support flags: they would suffix run_uid again -> SWIRL_BASE_pc1T_pc1T):
#   1. python -m naturenet.models.irl.get_stats   -y naturenet/config/v2/swirl/sharks_swirl_kfold_pc1T_t1.yaml
#        fits the pc1T ARHMM for K = 2, 4, 5 (K = 3 exists from the pseudo-count test and is skipped)
#   2. python -m naturenet.models.irl.get_stats_2 -y naturenet/config/v2/swirl/sharks_swirl_kfold_pc1T_t1.yaml
#        SWIRL init + final (S-1 and S-2), K = 2..5, 3 runs, 5 folds
#   3. python -m naturenet.models.irl.plot_ll_comparison -y naturenet/config/v2/swirl/sharks_ll_comparison.yaml
# Needs the ssm observations.py with ARCategoricalObservations._pseudo (pseudo-count fix) and the run_swirl_kfold.py
# temperature fix (default_final_temps).
# --- shared data block (identical in every full_plan shark config -> comparable LLs, shared folds) ---
n_states: null   # synced by naturenet.environment.sync_v2_configs (level K + 1 absorbing)
actions: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k12/hammerhead_v1_*_actions.pkl"
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k12/"
df_run_uid: "hammerhead_v1"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
                            # preprocessing cap max_segment_len (49 for the existing pkls; 60 gave 0 sequences)
segment_policy: "variable"
                            # near-equal pieces; null = no cap), padded + masked (exact LLs). Not for NN-SWIRL.
min_seq_len: 10
n_folds: 5
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/folds/"     # one fold file for ARHMM, SWIRL, NN-SWIRL, HIAVI and decision scales
# --- end shared data block ---

seed: 12345                 # base seed; get_stats* runs use seed + run index
n_hidden_init: 2
n_hidden: 2                 # must equal n_hidden_init (ARHMM / init params are per K)
emission_dim: 1
latent_state_dim: 1
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/levels/k12/baselines/"
run_uid: "SWIRL_BASE_pc1T_K12"   # level run

# One entry per animal key: <df_run_uid>_<key>_actions.pkl / <df_run_uid>_<key>_states_abstract_env.pkl
# (written by reprocess_env_stats_abstract). Lists, not single strings.
# groups: ["183623"]        # optional animal id per file (default: parsed from the actions file name)

# Global T, only used when per_fold_trans_prob is False

# Sequences

# Folds (shared by ARHMM and SWIRL, saved as <out_dir>/folds_<n>_seed<fold_seed>.json)
folds_to_run: null          # e.g. [0, 1]; or --fold on the command line

# Final run (run_swirl.py): hold out animals
holdout_fraction: 0.2       # 0 = train on all animals, no test LLs
# holdout_groups: ["183623"]

# Training
epochs_init: 50
epochs_init_2: 30
epochs: 50
epochs_2: 30
em_tol: null                # e.g. 1.0e-5 relative LL change for early stopping (null = fixed epochs)
# --- Speed (see CHANGES_SPEED.md). Exact options first, then the ones that trade accuracy for time. ---
s2_structured_vi: True      # exact: S-2 value iteration on T (S,A,S) + gather instead of the dense (S*M,A,S*M) new_T
                            #   (M^2 less VI compute, no dense S-2 tensor on host/GPU). False = previous dense path.
mstep_suff_stats: True      # exact: M-step objectives from per-E-step counts (independent of N and T)
mstep_emit_method: "auto"   # BFGS for <= mstep_emit_bfgs_max_params rewards (S-1, as before), else L-BFGS-B (S-2).
                            #   scipy BFGS's dense inverse Hessian costs ~1 s / iteration at K*S*M ~ 3000. "BFGS" = old.
mstep_emit_bfgs_max_params: 1000
mstep_emit_iters: 1000      # max optimizer iterations per M-step (generalised EM: 100-200 is usually enough because
mstep_trans_iters: 1000     #   each M-step warm-starts from the previous one; 1000 = original)
max_train_seqs: null        # e.g. 400: per-fold representative subsample (per-animal share + length quantiles,
max_test_seqs: null         #   fixed per fold across K / runs). null = all sequences.
temps_init: null            # default all 1
temps_final: 1.0            # was null ([0.01, 1, ...]): the near-greedy mode 0 is the likely cause of the fold-3 test collapse
use_init_reward: False      # warm-start final rewards from the *_init1 reward
run_s2: True
s2_max_dense_entries: 2.0e+8
cache_fold_inputs: True
s2_index_emissions: True     # S-2 emissions from int indices (x*M+slot) instead of dense (N,T,S*M) one-hots; same LLs,
                             # far less GPU memory. False = previous dense one-hots
overwrite: False            # False = skip folds whose outputs exist (resume)

# get_stats* loops (K in [min_latent, max_latent] inclusive)
min_latent: 2
max_latent: 5
num_runs: 3

run_arhmm: False            # ARHMM via get_stats (step 1)
arhmm_action_ll: True       # also score the ARHMM as an action model (train_ll_act / test_ll_act; plot "arhmm_act")
arhmm_pseudo_count: 1.0     # was 1.0e-5; best on every fold in the pseudo-count test
arhmm_pseudo_support: "T"   # was null; pseudo-count only on moves reachable under the fold's T
arhmm_pseudo_floor: 1.0e-5  # pseudo-count on unreachable moves when arhmm_pseudo_support = "T"
run_swirl_init: True
run_swirl_final: True
