# v2 environment (CMEMS v2 scenes + new SIT-FUSE clusters). Generated from config/time_series/sharks_correlation_final.yaml;
# only paths, n_states, input_keys / variables, env_window and the shared sequence settings differ.
# Final time-series analysis (intention / mode series vs environment and movement), great hammerheads.
#   python -m naturenet.models.time_series_analysis.correlation_analysis_shark -y config/v2/time_series/sharks_correlation_final_v2.yaml
# Input: per-animal series exported by plot_swirl_new / plot_hiavi (<plot_dir>/series_<model>_<order>/<uid>_time_series_pd.csv,
# originals only, __aug copies excluded). Run the plot steps (with plot_inputs: True) first so the 28 input columns exist.
# Output: <out_dir>/<second_dir>/<slice>/correlation_results.csv + plots.
main_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/final/
second_dir: [swirl/plots/series_linear_s1, hiql/plots/series_hiavi_s1]   # sharks: S-1 only
keys: [full]                  # no sex field in the shark tracks; full = every exported series
out_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/final/time_series/
data_slices: null              # null -> one slice 'full' = every *_time_series_pd.csv

# Pairs with a reward or latent column only (latent vs inputs / kinematics, reward vs inputs)
pair_filter: [reward, latent]
parent_child: {}
exclude: []                               # uid, segment, seg_pos, time, lat/lon are dropped already
categorical: []                           # latent, env, season are categorical by default
drop_columns: [seasaon]
min_rows: 4
missing_files: warn
top_n: 40

rolling_window: 20
max_lag: 8
significance_level: 0.05
min_correlation: 0.3
min_len: 8
n_bins: 8
