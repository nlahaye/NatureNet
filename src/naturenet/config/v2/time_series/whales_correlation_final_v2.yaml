# Pairs with a reward or latent column only (latent vs inputs / kinematics, reward vs inputs)
pair_filter: [reward, latent]
parent_child: {}
exclude: []                               # uid, segment, seg_pos, time, lat/lon are dropped already
categorical: []                           # latent, env, season are categorical by default
drop_columns: [seasaon]
min_rows: 4
missing_files: warn
top_n: 24

rolling_window: 20
max_lag: 8
significance_level: 0.05
min_correlation: 0.3
min_len: 8
n_bins: 8
