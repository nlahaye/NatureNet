# KINEMATIC copy of sharks_multiagent.yaml. Identical except: kinematics.enabled True (block below), run_uid, and
# its own output folder. Both the independent and the coupled models emit step / turn densities, so the
# coupling gain is compared within this run only (kinematic LLs are not comparable to action-only LLs).
# v2 environment (CMEMS v2 scenes + new SIT-FUSE clusters). Generated from config/swirl/full_plan/sharks_multiagent.yaml;
# only paths, n_states, input_keys / variables, env_window and the shared sequence settings differ.
# Run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# Phase D1 (sharks): coupled-intention HIQL (HIAVI). v2 HIQL best-fit K = 1 (= IAVI), where intention coupling
# is undefined, so K = 2 (the smallest K with more than one intention) is used.
# v2 best-fit K (smallest K within one fold-paired SE of the best mean; Table 1): sharks ARHMM 3, S-1 3, S-2 2,
# HIQL 1 (= IAVI); whales ARHMM 5, S-1 5, S-2 5, HIQL 2.
# Every choice below comes from the v2 data / v2 baselines; no v1-environment result is assumed.
#   python -m naturenet.models.irl.run_hiavi_multiagent  -y v2/swirl/sharks_multiagent_kin.yaml --concurrency_only
#   python -m naturenet.models.irl.run_hiavi_multiagent  -y v2/swirl/sharks_multiagent_kin.yaml --skip_null
#   python -m naturenet.models.irl.run_hiavi_multiagent  -y v2/swirl/sharks_multiagent_kin.yaml          # with nulls (if it passes)
#   python -m naturenet.models.irl.plot_hiavi_multiagent -y v2/swirl/sharks_multiagent_kin.yaml
# Outputs: <out_dir>/multiagent.
# --- shared data block (identical to the Phase B / C shark configs -> same sequences) ---
n_states: 481   # synced by sync_v2_configs
actions: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/hammerhead_v2_*_actions.pkl"   # originals + __aug copies
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/"
df_run_uid: "hammerhead_v2" # step times / positions from <df_dir>/<df_run_uid>_dfs.pkl
per_fold_trans_prob: True   # T from the training animals of each fold
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
segment_policy: "variable"
min_seq_len: 10
n_folds: 5                  # unused by the multi-agent runner (leave-one-animal-out), kept identical
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/folds/"
# --- end shared data block ---

seed: 12345
n_hidden: 2                 # = Ks (cosmetic; Ks sets K)
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/multiagent/"
run_uid: "SHARK_MA_KIN"

hiavi_discount: 0.9         # = Phase B HIQL
hiavi_restarts: 10
hiavi_mstep: "soft"
hiavi_pseudocount: 0.5
hiavi_max_iters: 200
hiavi_tol: 1.0e-6
hiavi_sticky: 0.95
hiavi_iavi_tol: 1.0e-8
hiavi_iavi_max_iters: 10000
hiavi_align: "swirl"

multiagent:
  backend: "hiavi"
  swirl:
    init: "arhmm"             # kinematic-free ARHMM warm start per fold (as run_swirl_kfold)
    arhmm_epochs: 50
    restarts: 1               # independent-model restarts per fold (best train LL kept)
    epochs: 50                # stage 1 (S-1 EM) = Phase B / C schedule
    epochs_2: 30              # stage 2 (temps_final) = Phase B / C
    coupled_iters: 10         # EM iterations per mean-field outer iteration (n_outer)
  # animals: null -> every shark in the v2 tracks (v2 scenes cover the full tracking period).
  # Held-out set from the v2 concurrency report (ma_concurrency.csv): every animal with >= min_context_steps
  # original steps that have partner context. Run --concurrency_only first to see who overlaps.
  heldout_min_context: True
  max_aug: 2                  # originals + __aug1..2 per shark (as whales)
  window: {scene_index_csv: "/data/nlahaye/NatureNet_Env/Copernicus/v2/sharks/sharks_scene_index.csv"}   # time-shift null calendar = first .. last complete v2 scene day
  Ks: [2]                     # v2 HIQL best-fit K = 1 has one intention (no coupling); 2 = smallest coupled K
  variants:
    temporal:  {h_days: 1.0, max_dt_days: 3.0}                                  # co-timing only
    proximity: {h_days: 1.0, max_dt_days: 3.0, lambda_km: 50.0, max_km: 150.0}  # co-timing x closeness
  n_outer: 5                  # mean-field outer iterations (context <-> posteriors)
  alpha0: 0.1                 # initial coupling
  n_null: 50
  null_variants: ["temporal", "proximity"]
  null_min_shift_days: 30     # partners shifted by U(30, L - 30) days, independently per animal
  n_null_sync: 500            # replicates for the synchrony index (no refit; cheap)
  sync_variant: "temporal"
  eval_include_aug: False     # score held-out ORIGINAL tracks only
  min_context_steps: 30       # warn if < 2 animals reach this many steps with partner context
  ma_subdir: "multiagent_kin"   # <out_dir>/multiagent_kin/

# SWIRL keys (used by the swirl backend; harmless for HIAVI)
emission_dim: 1
latent_state_dim: 1
temps_final: 1.0            # scalar -> every intention at T = 1 in stage 2 (= Phase B / C; a 2-element list breaks K = 3)
em_tol: null

# Kinematic emissions: same block as the single-animal kinematic CV (sharks_swirl_kfold_kin.yaml / sharks_hiavi_kfold_kin.yaml),
# so the multi-agent and single-animal kinematic results use the same step / turn model.
kinematics:
  enabled: True
  step_feature: "speed_kmh"     # irregular Argos dt
  step_dist: "gamma"
  use_step: True
  use_turn: True
  fix_mu0: False
  zero_km: 0.05                 # moves shorter than this are "stationary" (zero-inflation mass)
  min_dt_h: 3.0                 # steps with dt below this get no kinematic factor (Argos error)
  max_speed_kmh: 15.0           # implausible speeds -> missing
  weight: 1.0
  kappa_max: 200.0
  min_weight: 2.0
  label_margin: 0.5
  # dfs_pkl: default <df_dir>/<df_run_uid>_dfs.pkl
