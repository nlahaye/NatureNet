# KINEMATIC single-animal decision scales, SWIRL emission at K = 5 (whale secondary tool: SWIRL S-2 + kin K = 5).
# Copy of whales_swirl_scales_fixed.yaml (fixed epochs 50 / 30, scales.init arhmm) except: the kinematics block of
# whales_swirl_kfold_kin.yaml, run_uid WHALE_SWIRL_SCALES_KIN, out_dir Blue_Whale_v2/scales_kin/, and the init is the
# KINEMATIC baseline ARHMM (WHALE_SWIRL_BASE_kin run 0, seed 12345, K = 5). N1 = S-1 + kin; N2 (order 2) is the
# S-2 analogue, so the order gain N2 - N1 and the layer gains on top of N2 describe the S-2 tool.
# v2 environment; run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# 1. Link the kinematic baseline ARHMM init into the new out_dir (scripts/run_scales_kfold.sh does this):
#      mkdir -p /data/nlahaye/NatureNet/Blue_Whale_v2/scales_kin && cd $_
#      for k in 0 1 2 3 4; do ln -sf ../baselines_kin/WHALE_SWIRL_BASE_kin_loop_0_latent_5_states_5_hidden_12345_seed_arhmm_s_KF_$k.npz \
#        WHALE_SWIRL_SCALES_KIN_5_hidden_12345_seed_arhmm_s_KF_$k.npz; done
# 2. python -m naturenet.models.irl.run_swirl_scales_kfold -y naturenet/config/v2/swirl/whales_swirl_scales_kin.yaml --check
# 3. python -m naturenet.models.irl.run_swirl_scales_kfold -y naturenet/config/v2/swirl/whales_swirl_scales_kin.yaml [--fold k]
# 4. python -m naturenet.models.irl.plot_swirl_scales -y naturenet/config/v2/swirl/whales_swirl_scales_kin.yaml
# Check: N1 test LL per fold should be close to the kinematic S-1 K = 5 run 0 (-1.846 -1.808 -1.814 -1.826 -1.841);
# the kinematic S-2 K = 5 run 0 is -1.703 -1.645 -1.743 -1.648 -1.705 (N2 is an analogue, not an exact match).
n_states: null              # synced by naturenet.environment.sync_v2_configs (K clusters + 1 absorbing)
actions: "/data/nlahaye/NatureNet/Blue_Whale_v2/SWIRL_WHALE_1517_*_actions.pkl"   # originals + __aug copies
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/"
df_run_uid: "SWIRL_WHALE_1517"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
segment_policy: "variable"
min_seq_len: 10
n_folds: 5                  # 44 animals (2015 + 2017, <year>_<uid>) -> 8-9 per test fold (folds group by base id, so __aug copies stay together)
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/folds/"   # one fold file for ARHMM, SWIRL, HIAVI and decision scales
# --- end shared data block ---
# Every toggle defaults to off (order 1 + all off = SWIRL S-1). Durations need max_duration <= seq_len / 3 (D = 12).

seed: 12345
n_hidden_init: 5            # v2 S-1 best-fit K
n_hidden: 5                 # v2 S-1 best-fit K
emission_dim: 1
latent_state_dim: 1
out_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/scales_kin/"
run_uid: "WHALE_SWIRL_SCALES_KIN"

folds_to_run: null
holdout_fraction: 0.2

epochs: 50                  # stage 1 (no temperature)
epochs_2: 30                # stage 2 (temps_final)
em_tol: null                # fixed epochs (= the Phase B baseline)
temps_final: 1.0            # = Phase B / the Phase C run
run_arhmm: False            # baseline ARHMM linked (header step 1)
run_swirl_init: False       # baseline S-1 / S-2 already exist (Blue_Whale_v2/baselines/)
run_swirl_final: False
run_s2: False
epochs_init: 50
epochs_init_2: 30
overwrite: False

kinematics:                 # = whales_hiavi_kfold_kin.yaml / whales_swirl_kfold_kin.yaml (the kinematic baselines)
  enabled: True
  step_feature: "speed_kmh"
  step_dist: "gamma"
  use_step: True
  use_turn: True
  fix_mu0: False
  zero_km: 0.05
  min_dt_h: 3.0
  max_speed_kmh: 15.0
  weight: 1.0
  kappa_max: 200.0
  min_weight: 2.0
  label_margin: 0.5

scales:
  init: "arhmm"             # fail if the linked ARHMM is missing (no silent sticky_init)
  warm_start: True
  warm_epochs: 30
  reward_param: "additive"
  reward_l2: 1.0
  context_min_count: 5      # prune k-grams (k >= 2) seen < 5 times in the training animals
  context_source: "train"
  context_t_support: False
  reward_optimizer: "auto"
  reward_tol: null

  defaults:
    switch_history: {kind: "lags+decay", lags: 2, decay_steps: [3, 10], window: 10}
    durations: {hazard: "logistic", max_duration: 12, hazard_features: False, smooth: 1.0, l2: 1.0}
    hierarchy: {n_regimes: 2, sticky: 0.95, prior: 0.0, init_noise: 0.5}

  grid:
    order: [1, 2, 3]          # drop 3 if --check shows < ~20 steps per deep context; add 4 only if N3 is N*
    switch_history: ["off"]
    durations: ["off"]
    hierarchy: ["off"]
  variants:
    - {switch_history: "on"}
    - {durations: "on"}
    # - {durations: {hazard: "nonparametric", smooth: 5.0}}     # only if the logistic hazard is kept (shape check)
    - {hierarchy: "on"}
    - {switch_history: "on", durations: "on"}
    # - {switch_history: "on", durations: "on", hierarchy: "on"}   # only if >= 2 single layers are kept
  # Stage B (after A): best latent configuration crossed with order, e.g.
  #   - {order: 2, durations: "on"}
