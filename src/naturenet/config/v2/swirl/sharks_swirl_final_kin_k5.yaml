# Final single-animal SWIRL + kinematics fit (sharks, K = 5; S-1 is the secondary behavior-analysis tool, S-2 is fitted
# alongside as an extra view). Chosen with the fold-paired 1-SE rule on the kinematic CV (SWIRL_BASE_pc1T_kin):
# K* = 5 for S-1 + kin and S-2 + kin; S-2 - S-1 at K = 5 is +0.004 +/- 0.031 (4/5 folds), a tie, so S-1 (simpler) is
# the tool. Replaces HIQL + kin K = 2 as the shark secondary.
# Copy of sharks_swirl_final.yaml except: n_hidden(_init) 5, run_s2 True, swirl_orders [s1, s2], the kinematics block
# of sharks_swirl_kfold_kin.yaml (kinematic ARHMM init with the same pc1T settings, then kinematic S-1 / S-2),
# run_uid SHARK_SWIRL_KIN_FINAL, out_dir / plot_dir final/swirl_kin/.
# v2 environment; run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# holdout_fraction 0: one fit on every animal. LL files hold the comparable LL plus LL_joint / LL_kin_null / LL_action.
#   python -m naturenet.models.irl.run_swirl               -y v2/swirl/sharks_swirl_final_kin_k5.yaml
#   python -m naturenet.models.irl.plot_swirl_new          -y v2/swirl/sharks_swirl_final_kin_k5.yaml
#   python -m naturenet.models.irl.reward_env_projection   -y v2/swirl/sharks_swirl_final_kin_k5.yaml -p v2/swirl/sharks_reward_env_projection_s1_kin.yaml --n_hidden 5
# (scripts/run_shark_swirl_kin.sh runs these and every downstream step.)
# --- shared data block (identical to the Phase B / C shark configs -> same sequences) ---
n_states: null              # synced by naturenet.environment.sync_v2_configs (K clusters + 1 absorbing)
actions: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/hammerhead_v2_*_actions.pkl"   # originals + __aug copies
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/"
df_run_uid: "hammerhead_v2" # step times / positions from <df_dir>/<df_run_uid>_dfs.pkl
per_fold_trans_prob: True   # T from the training animals of each fold
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
segment_policy: "variable"
min_seq_len: 10
n_folds: 5                  # unused by the multi-agent runner (leave-one-animal-out), kept identical
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/folds/"
# --- end shared data block ---


seed: 12345                 # base seed; get_stats* runs use seed + run index
n_hidden_init: 5          # kinematic S-1 / S-2 K* (fold-paired 1-SE rule)
n_hidden: 5               # kinematic S-1 / S-2 K*
emission_dim: 1
latent_state_dim: 1
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/final/swirl_kin/"
run_uid: "SHARK_SWIRL_KIN_FINAL"

# One entry per animal key: <df_run_uid>_<key>_actions.pkl / <df_run_uid>_<key>_states_abstract_env.pkl
# (written by reprocess_env_stats_abstract). Lists, not single strings.
# groups: ["183623"]        # optional animal id per file (default: parsed from the actions file name)

# Global T, only used when per_fold_trans_prob is False

# Sequences

# Folds (shared by ARHMM and SWIRL, saved as <out_dir>/folds_<n>_seed<fold_seed>.json)

# Final run (run_swirl.py): hold out animals
holdout_fraction: 0.0   # train on every animal (test LLs come from the CV); 0.2 = holdout check
# holdout_groups: ["183623"]

# Training
epochs_init: 50
epochs_init_2: 30
epochs: 50
epochs_2: 30
em_tol: null                # e.g. 1.0e-5 relative LL change for early stopping (null = fixed epochs)
# --- Speed (see CHANGES_SPEED.md). Exact options first, then the ones that trade accuracy for time. ---
s2_structured_vi: True      # exact: S-2 value iteration on T (S,A,S) + gather instead of the dense (S*M,A,S*M) new_T
                            #   (M^2 less VI compute, no dense S-2 tensor on host/GPU). False = previous dense path.
mstep_suff_stats: True      # exact: M-step objectives from per-E-step counts (independent of N and T)
mstep_emit_method: "auto"   # BFGS for <= mstep_emit_bfgs_max_params rewards (S-1, as before), else L-BFGS-B (S-2).
                            #   scipy BFGS's dense inverse Hessian costs ~1 s / iteration at K*S*M ~ 3000. "BFGS" = old.
mstep_emit_bfgs_max_params: 1000
mstep_emit_iters: 1000      # max optimizer iterations per M-step (generalised EM: 100-200 is usually enough because
mstep_trans_iters: 1000     #   each M-step warm-starts from the previous one; 1000 = original)
max_train_seqs: null        # e.g. 400: per-fold representative subsample (per-animal share + length quantiles,
max_test_seqs: null         #   fixed per fold across K / runs). null = all sequences.
temps_init: null            # default all 1
temps_final: 1.0
use_init_reward: False      # warm-start final rewards from the *_init1 reward
run_s2: True    # S-2 + kin at the same K (extra view; tied with S-1 at K = 5)
s2_max_dense_entries: 2.0e+8
cache_fold_inputs: True
s2_index_emissions: True     # S-2 emissions from int indices (x*M+slot) instead of dense (N,T,S*M) one-hots; same LLs,
                             # far less GPU memory. False = previous dense one-hots
overwrite: False            # False = skip folds whose outputs exist (resume)

# get_stats* loops (K in [min_latent, max_latent] inclusive)

run_arhmm: True
arhmm_pseudo_count: 1.0   # = the Phase B pc1T run
arhmm_pseudo_support: "T"   # = the Phase B pc1T run
arhmm_pseudo_floor: 1.0e-5   # = the Phase B pc1T run
run_swirl_init: True
run_swirl_final: True
arhmm_epochs: 100

# Plots / time series (plot_swirl_new) and reward projection (reward_env_projection) read the final files
swirl_model: "linear"
swirl_orders: ["s1", "s2"]
splits: ["train"]           # holdout_fraction 0: no test files
lon_bounds: [-100, -60]     # = v2 env grid
lat_bounds: [20, 40]
plot_trajs: True
plot_gifs: False            # True + envs pickle for reward / env GIFs
# input_keys = input_channels of the v2 sample step; needs <df_dir>/hammerhead_v2_<key>_states_input.pkl from
#   python -m naturenet.environment.sample_env_inputs -y config/v2/environment/sharks_sample_inputs_v2.yaml
# Post-hoc analyses only (series export, plots, correlation, exploit / explore, reward projection): fixes outside
# the environmental scene calendar are dropped. Fixes inside it with no env data (land / nodata) keep the
# absorbing state. Fits / LLs are unchanged (still trained with invalid_state: absorbing). Same calendar as
# config/v2/environment/sharks_sample_inputs_v2.yaml (scene_index_csv / nearest_scene_days).
env_window:
  scene_index_csv: "/data/nlahaye/NatureNet_Env/Copernicus/v2/sharks/sharks_scene_index.csv"   # first .. last complete v2 scene day
  nearest_days: 0
plot_inputs: True
input_keys: ["__run_sync_v2_configs__"]   # synced: = input_channels of the sample_inputs_v2 step
reward_normalize: "global"
plot_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/final/swirl_kin/plots/"
# envs: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/envs.pkl"
# env_lon_bounds / env_lat_bounds: extent of the env maps, if different from the track bounds

# Kinematic emissions: same block as the kinematic CV (sharks_swirl_kfold_kin.yaml / sharks_hiavi_kfold_kin.yaml).
kinematics:
  enabled: True
  step_feature: "speed_kmh"     # irregular Argos dt
  step_dist: "gamma"
  use_step: True
  use_turn: True
  fix_mu0: False
  zero_km: 0.05                 # moves shorter than this are "stationary" (zero-inflation mass)
  min_dt_h: 3.0                 # steps with dt below this get no kinematic factor (Argos error)
  max_speed_kmh: 15.0           # implausible speeds -> missing
  weight: 1.0
  kappa_max: 200.0
  min_weight: 2.0
  label_margin: 0.5
  # dfs_pkl: default <df_dir>/<df_run_uid>_dfs.pkl
