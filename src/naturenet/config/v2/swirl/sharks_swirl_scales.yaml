# v2 environment (CMEMS v2 scenes + new SIT-FUSE clusters). Generated from config/swirl/full_plan/sharks_swirl_scales.yaml;
# only paths, n_states, input_keys / variables, env_window and the shared sequence settings differ.
# Run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# Shark decision scales on SWIRL S-1 at K = 3 (Phase C). Every variant uses the S-1 schedule (state reward, recurrent
# switching); N1 (order 1, all layers off) is S-1 K = 3. N2 / N3 add ridge-penalised history increments to the S-1
# reward (additive); this is an order test on S-1, not S-2. Drop order 2 / 3 from the grid for an order-1-only run.
# Changes vs the previous version: /data/nlahaye paths; seq_len 60, variable, min_seq_len 10 (= Phase B);
# temps_final 1.0; D = 12 (= whales); init from the Phase B ARHMM; no S-1 / S-2 reference fits (run_s2 False).
# 1. Link the Phase B ARHMM init (run 0, seed 12345, K = 3) into the scales out_dir
#    (the pc1T ARHMM = the init of the Phase B S-1 / S-2 runs in sharks_swirl_kfold_pc1T_t1.yaml):
#      cd /data/nlahaye/NatureNet/Hammerhead_Out_v2/scales/
#      for k in 0 1 2 3 4; do ln -s ../baselines/SWIRL_BASE_pc1T_loop_0_latent_3_states_3_hidden_12345_seed_arhmm_s_KF_$k.npz \
#        SWIRL_SCALES_3_hidden_12345_seed_arhmm_s_KF_$k.npz; done
# 2. python -m naturenet.models.irl.run_swirl_scales_kfold -y naturenet/config/v2/swirl/sharks_swirl_scales.yaml --check
# 3. python -m naturenet.models.irl.run_swirl_scales_kfold -y naturenet/config/v2/swirl/sharks_swirl_scales.yaml
# 4. python -m naturenet.models.irl.plot_swirl_scales      -y naturenet/config/v2/swirl/sharks_swirl_scales.yaml
# Check: N1 test LL per fold should be close to Phase B S-1 K = 3 run 0. Report gains with and without fold 3.
n_states: null              # synced by naturenet.environment.sync_v2_configs (K clusters + 1 absorbing)
actions: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/hammerhead_v2_*_actions.pkl"
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/"
df_run_uid: "hammerhead_v2"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
segment_policy: "variable"
min_seq_len: 10
n_folds: 5
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/folds/"     # one fold file for ARHMM, SWIRL, NN-SWIRL, HIAVI and decision scales
# --- end shared data block ---
# SWIRL decision-scale variants (swirl_scales / run_swirl_scales_kfold). Same data, folds, per-fold T and ARHMM
# init as run_swirl_kfold; every toggle defaults to off (order 1 + all off = SWIRL S-1).
#   python -m naturenet.models.irl.run_swirl_scales_kfold -y swirl_scales.yaml --check      # segment / context report
#   python -m naturenet.models.irl.run_swirl_scales_kfold -y swirl_scales.yaml [--fold 0]
#   python -m naturenet.models.irl.plot_swirl_scales      -y swirl_scales.yaml
# ARHMM init: run run_swirl_kfold with run_arhmm: True on this YAML first (or scales.init: sticky).

seed: 12345
n_hidden_init: 3            # = K* from Phase B (edit)
n_hidden: 3                 # = K* from Phase B (edit)
emission_dim: 1
latent_state_dim: 1
out_dir: "/data/nlahaye/NatureNet/Hammerhead_Out_v2/scales/"
run_uid: "SWIRL_SCALES"



# Durations and regimes need long sequences: max_duration <= T / 2 and several regime switches per sequence.
# All variants in one sweep share seq_len, so their LLs are comparable. Run --check before choosing.

folds_to_run: null
holdout_fraction: 0.2

epochs: 50                  # stage 1 (no temperature)
epochs_2: 30                # stage 2 (temps_final)
em_tol: 1.0e-5
temps_final: 1.0            # = the Phase B shark runs
run_arhmm: False            # reuse the Phase B ARHMM init (symlink commands in the header)
run_swirl_init: False       # N1 is S-1: the Phase B S-1 K = 3 runs are the reference
run_swirl_final: False
run_s2: False               # no S-2 reference fits
epochs_init: 50
epochs_init_2: 30
overwrite: False

# kinematics: {enabled: True, step_feature: "speed_kmh", min_dt_h: 0.5}   # optional; LL = comparable LL

scales:
  init: "arhmm"             # Phase B ARHMM init (fails loudly if the symlinks are missing)
  warm_start: True          # order N starts from the fitted order N-1 with the same latent layers (stage 2 only)
  warm_epochs: 30
  reward_param: "additive"  # S-1 reward + ridge-penalised history increments ("free" = S-2 layout: do not use)
  reward_l2: 1.0            # Gaussian prior on depth-k increments, precision ~ 2 * reward_l2 * (k - 1) (per step)
  context_min_count: 5      # prune k-grams (k >= 2) seen < 5 times in the training animals
  context_source: "train"   # train | all
  context_t_support: False  # keep False (True + free + order 2 reproduces S-2)
  reward_optimizer: "auto"  # BFGS up to 3000 reward parameters, else L-BFGS-B
  reward_tol: null          # null -> 1e-4 at order 1 (matches SWIRL), 1e-8 at order > 1 (deep contexts need it)

  # Settings used when a layer is "on" in the grid (a dict in the grid / variants overrides them).
  defaults:
    switch_history: {kind: "lags+decay", lags: 2, decay_steps: [3, 10], window: 10}
    durations: {hazard: "logistic", max_duration: 12, hazard_features: False, smooth: 1.0, l2: 1.0}
    hierarchy: {n_regimes: 2, sticky: 0.95, prior: 0.0, init_noise: 0.5}

  # Stage A (nested layers at order 1) and the order sweep on the baseline. Order N = context depth:
  # reward on N-grams, action choice depends on the last N-1 states (N = 2 is S-2: transition reward only).
  grid:
    order: [1, 2, 3]          # add 4 only if N3 is N* (within 1 SE of the best)
    switch_history: ["off"]
    durations: ["off"]
    hierarchy: ["off"]
  variants:
    - {switch_history: "on"}
    - {durations: "on"}
    # - {durations: {hazard: "nonparametric", smooth: 5.0}}     # only if the logistic hazard is kept (shape check)
    - {hierarchy: "on"}
    - {switch_history: "on", durations: "on"}
    # - {switch_history: "on", durations: "on", hierarchy: "on"}   # only if >= 2 single layers are kept
  # Stage B (after A): add the best latent configuration crossed with order, e.g.
  #   - {order: 2, durations: "on"}
  #   - {order: 3, durations: "on"}
