# Final single-animal SWIRL + kinematics fit (whales, K = 5; S-2 is the secondary behavior-analysis tool, S-1 is fitted
# alongside by the runner). Copy of whales_swirl_final.yaml except: the kinematics block of whales_swirl_kfold_kin.yaml
# (kinematic ARHMM init, then kinematic S-1 / S-2), run_uid WHALE_SWIRL_KIN_FINAL, out_dir final/swirl_kin/.
# v2 environment; run naturenet.environment.sync_v2_configs before use (fills n_states, input_keys, variables).
# holdout_fraction 0: one fit on every animal. LL files hold the comparable LL plus LL_joint / LL_kin_null / LL_action.
#   python -m naturenet.models.irl.run_swirl               -y v2/swirl/whales_swirl_s2_final_kin_k5.yaml
#   python -m naturenet.models.irl.plot_swirl_new          -y v2/swirl/whales_swirl_s2_final_kin_k5.yaml
#   python -m naturenet.models.irl.reward_env_projection   -y v2/swirl/whales_swirl_s2_final_kin_k5.yaml -p v2/swirl/whales_reward_env_projection_s2_kin.yaml --n_hidden 5
# (scripts/run_final_fits.sh runs all three.)
# --- shared data block (identical in every full_plan whale config -> comparable LLs, shared folds) ---
n_states: null              # synced by naturenet.environment.sync_v2_configs (K clusters + 1 absorbing)
actions: "/data/nlahaye/NatureNet/Blue_Whale_v2/SWIRL_WHALE_1517_*_actions.pkl"   # originals + __aug copies
positions: "auto"           # each <...>_actions.pkl paired with <...>_states_abstract_env.pkl
df_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/"
df_run_uid: "SWIRL_WHALE_1517"
per_fold_trans_prob: True
fill_unobserved: "self_loop"
require_full_trans_prob: True
seq_len: 60                 # variable policy: one sequence per valid run, runs > 60 split
segment_policy: "variable"
min_seq_len: 10
n_folds: 5                  # 44 animals (2015 + 2017, <year>_<uid>) -> 8-9 per test fold (folds group by base id, so __aug copies stay together)
fold_seed: 0
folds_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/folds/"   # one fold file for ARHMM, SWIRL, HIAVI and decision scales
# --- end shared data block ---


seed: 12345                 # base seed; get_stats* runs use seed + run index
n_hidden_init: 5
n_hidden: 5   # SWIRL S-2 + kin secondary tool
emission_dim: 1
latent_state_dim: 1
out_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/final/swirl_kin/"
run_uid: "WHALE_SWIRL_KIN_FINAL"

holdout_fraction: 0.0   # train on every animal (test LLs come from the CV); 0.2 = holdout check

# Training
epochs_init: 50
epochs_init_2: 30
epochs: 50
epochs_2: 30
em_tol: null                # e.g. 1.0e-5 relative LL change for early stopping (null = fixed epochs)
# --- Speed (see CHANGES_SPEED.md). Exact options first, then the ones that trade accuracy for time. ---
s2_structured_vi: True      # exact: S-2 value iteration on T (S,A,S) + gather instead of the dense (S*M,A,S*M) new_T
                            #   (M^2 less VI compute, no dense S-2 tensor on host/GPU). False = previous dense path.
mstep_suff_stats: True      # exact: M-step objectives from per-E-step counts (independent of N and T)
mstep_emit_method: "auto"   # BFGS for <= mstep_emit_bfgs_max_params rewards (S-1, as before), else L-BFGS-B (S-2).
                            #   scipy BFGS's dense inverse Hessian costs ~1 s / iteration at K*S*M ~ 3000. "BFGS" = old.
mstep_emit_bfgs_max_params: 1000
mstep_emit_iters: 1000      # max optimizer iterations per M-step (generalised EM: 100-200 is usually enough because
mstep_trans_iters: 1000     #   each M-step warm-starts from the previous one; 1000 = original)
max_train_seqs: null        # e.g. 400: per-fold representative subsample (per-animal share + length quantiles,
max_test_seqs: null         #   fixed per fold across K / runs). null = all sequences.
temps_init: null            # default all 1
temps_final: 1.0
                            #   K = 1 results made before the fix are invalid: rerun with whales_swirl_kfold_k1_rerun.yaml
use_init_reward: False
run_s2: True   # S-2 is the tool; S-1 is also fitted
s2_max_dense_entries: 2.0e+8
cache_fold_inputs: True
s2_index_emissions: True     # S-2 emissions from int indices (x*M+slot) instead of dense (N,T,S*M) one-hots; same LLs,
                             # far less GPU memory. False = previous dense one-hots
overwrite: False            # False = skip folds whose outputs exist (resume)

# get_stats* loops (K in [min_latent, max_latent] inclusive). K = 1 is the no-switching reference.
# Extend to 6 only if test LL at K = 5 is > 1 SEM above K = 4.

run_arhmm: True
arhmm_pseudo_count: 1.0e-5  # ARHMM transition-count pseudo-count (ssm default 1e-5). Sweep with get_stats.py
                            #   --pseudo_count 0.01 / 0.1 / 1 (suffixes run_uid with _pc<value>)
arhmm_pseudo_support: null  # null = every x -> x'; "T" = only moves reachable under the fold's T
arhmm_pseudo_floor: 1.0e-5  # pseudo-count on unreachable moves when arhmm_pseudo_support = "T"
run_swirl_init: True
run_swirl_final: True
arhmm_epochs: 100

# Plots / time series (plot_swirl_new) and reward projection (reward_env_projection) read the final files
swirl_model: "linear"
swirl_orders: ["s1", "s2"]
splits: ["train"]           # holdout_fraction 0: no test files
lon_bounds: [-126, -110]     # = v2 env grid
lat_bounds: [22, 40]
plot_trajs: True
plot_gifs: False            # True + envs pickle for reward / env GIFs
# input_keys = input_channels of the v2 sample step; needs <df_dir>/SWIRL_WHALE_1517_<key>_states_input.pkl from
#   python -m naturenet.environment.sample_env_inputs -y config/v2/environment/whales_sample_inputs_v2.yaml
# Post-hoc analyses only: fixes outside the v2 scene calendar are dropped (fits unchanged).
env_window:
  scene_index_csv: "/data/nlahaye/NatureNet_Env/Copernicus/v2/whales/whales_scene_index.csv"   # first .. last complete v2 scene day
  nearest_days: 0
plot_inputs: True
input_keys: ["__run_sync_v2_configs__"]   # synced: = input_channels of the sample_inputs_v2 step
reward_normalize: "global"
plot_dir: "/data/nlahaye/NatureNet/Blue_Whale_v2/final/swirl_kin/plots/"
# envs: "/data/nlahaye/NatureNet/Blue_Whale_v2/envs.pkl"
# env_lon_bounds / env_lat_bounds: extent of the env maps, if different from the track bounds

kinematics:                 # = whales_hiavi_kfold_kin.yaml / whales_swirl_kfold_kin.yaml (the kinematic baselines)
  enabled: True
  step_feature: "speed_kmh"
  step_dist: "gamma"
  use_step: True
  use_turn: True
  fix_mu0: False
  zero_km: 0.05
  min_dt_h: 3.0
  max_speed_kmh: 15.0
  weight: 1.0
  kappa_max: 200.0
  min_weight: 2.0
  label_margin: 0.5
