# Multi-agent copy of sharks_habitat_tests.yaml (same availability, thresholds, lagged inputs, seasons; only out_dir
# and tools differ). Written for scripts/run_multiagent_v2.sh STAGE=downstream; missing tools are skipped.
# Multi-agent series carry no per-step reward (reward_likelihood NaN), so the lags part reports the mode
# association and use vs availability only. Do not run --part lag_profiles here (tool-independent; habitat_tests/).
# Habitat tests by behavioural mode, great hammerheads (v2 environments only; literature-comparison analyses 1 and 3).
#   python -m naturenet.drivers.lagged_env    -y config/v2/drivers/sharks_habitat_tests.yaml --part scene
#   python -m naturenet.drivers.habitat_tests -y config/v2/drivers/sharks_habitat_tests.yaml [--part features|seasons]
# Inputs as in whales_habitat_tests.yaml. Wet season May-Oct, dry Nov-Apr (Bahamas; Guttridge et al. 2025); the
# months are configuration only, so any month grouping (or a whale early / late season) uses the same code.
habitat_tests:
  species: sharks
  out_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/drivers/habitat_tests_ma/      # multi-agent tools; thresholds / lagged inputs shared with habitat_tests/
  sample_inputs_yaml: config/v2/environment/sharks_sample_inputs_v2.yaml
  availability:
    sample_inputs_yaml: config/v2/environment/sharks_sample_inputs_v2.yaml
    avl_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/drivers/availability/
    n_available: 10
    seed: 0
  tools:                              # multi-agent full-data fits (export_ma_series), HIQL + kin K = 5 and SWIRL S-1 + kin K = 5
    - {label: ma_hiql_k5_indep, series_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/multiagent/multiagent_kin/series_K5/indep}
    - {label: ma_hiql_k5_temporal, series_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/multiagent/multiagent_kin/series_K5/temporal}
    - {label: ma_hiql_k5_best, series_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/multiagent/multiagent_kin_coupling/series_K5/best}
    - {label: ma_swirl_k5_indep, series_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/multiagent/multiagent_swirl_kin/series_K5/indep}
    - {label: ma_swirl_k5_best, series_dir: /data/nlahaye/NatureNet/Hammerhead_Out_v2/multiagent/multiagent_swirl_kin_coupling/series_K5/best}
  mode_at: step
  n_boot: 1000
  seed: 0

  features:                           # analysis 1 for sharks (directed mode vs SST / CHL fronts, upwelling)
    fronts:
      sst_front: {channel: grad_mag_sst, percentile: 90}
      chl_front: {channel: grad_mag_log10_CHL, percentile: 90}
    eddy: {channel: okubo_weiss_geo, threshold: 0.2, polarity_channel: rossby_geo}
    threshold_source: scene
    masks:
      ekman_upwelling: {channel: ekman_pumping, op: ">", value: 0.0}
  scene_stats:
    csv: /data/nlahaye/NatureNet/Hammerhead_Out_v2/drivers/habitat_tests/scene_feature_stats.csv
    workers: 4

  # Analysis 3: thermal refuge (wet-season fast modes over deeper, cooler bottom water?)
  seasons:
    groups: {wet: [5, 6, 7, 8, 9, 10], dry: [11, 12, 1, 2, 3, 4]}
    contrast: [wet, dry]
    channels: [depth_m, bottomT, sst_minus_bottomT, sst, dist_200m_isobath_km, slope_deg]
  lagged: null
