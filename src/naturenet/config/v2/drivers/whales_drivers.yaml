# Environmental-driver tests 1-7 + Rep_Taxonomy geometry / synthesis, blue whales (v2 environments only).
#   python -m naturenet.drivers.plan -y config/v2/drivers/whales_drivers.yaml --out <plan.yaml>   (see ENV_DRIVERS.md)
#   python -m naturenet.drivers.audit -y config/v2/drivers/whales_drivers.yaml
# Chosen kinematics-enabled tools: HIQL K = 5 (primary), SWIRL S-2 K = 5 (secondary). Sequences: seq_len 60,
# segment_policy variable, min_seq_len 10 (inherited from the run configs). The fine-level K sweep (min_latent 1)
# stays in config/v2/swirl; the levels / nulls fit K = 5 only (levels spec overrides).
species: whales
root: /data/nlahaye/NatureNet/Blue_Whale_v2/
drivers_dir: /data/nlahaye/NatureNet/Blue_Whale_v2/drivers/
levels_spec: config/v2/levels/whales_levels_v2.yaml
level_config_dir: config/v2/levels/whales          # generated by make_level_configs (setup stage)
generated_dir: config/v2/drivers/generated/whales  # variant run configs + analysis specs written by plan
include_fine_fits: False   # fine-level fits come from the kinematic baseline / scales plans (audited, not re-planned)

fine:                      # fine-level (reference) run configs
  hiavi_kfold_kin: config/v2/swirl/whales_hiavi_kfold_kin.yaml
  hiql_scales_kin_k5: config/v2/swirl/whales_hiql_scales_kin_k5.yaml
  reward_env_projection_hiql: config/v2/swirl/whales_reward_env_projection_hiql.yaml
levels: [fine, parent, k30, k20, k12, seascape]
nulls: [null_shift, null_shuffle, null_marginal, null_single]
K: 5

# Test 1 + 2: environment level (and nulls) x decision scale grid, paired held-out LL
env_levels:
  runs: [hiavi_kfold_kin, hiql_scales_kin_k5]      # fitted at every non-fine level and null
  reference: {level: fine, decision: N1}
  no_env_level: null_single

# Test 3: leave-year-out transfer (2015 <-> 2017)
year_transfer:
  year_groups: "2015;2017"
  folds_dir: /data/nlahaye/NatureNet/Blue_Whale_v2/folds_year/
  levels: [fine, k12, null_shift, null_single]
  runs: [hiavi_kfold_kin, hiql_scales_kin_k5]
  scales_grid: {order: [1, 2]}                     # reduced decision grid for the transfer test (2 folds)

# Test 4: posterior predictive checks + calibration (HIAVI / HIQL family; SWIRL S-2 is covered by tests 5 and 7)
ppc:
  n_sim: 50
  models:
    - {label: hiql_kin_k5, level: fine, K: 5}
    - {label: hiql_kin_k5_k12, level: k12, K: 5}
    - {label: hiql_kin_k5_null_shift, level: null_shift, K: 5}

# Test 5: driver attribution consistency across levels / model kinds / folds
consistency:
  n_boot: 200
  levels: [fine, parent, k30, k20, k12, seascape, null_shift]   # HIQL + kin K = 5 at each (null_shift = control)
  scales_variants: [N1, N2]                                    # fine-level decision scales (HIQL_<v>)
  multiagent: {yaml: config/v2/swirl/whales_multiagent_kin.yaml, K: 5, fit: indep}

# Test 6: social coupling vs shared environment (environment-matched null)
coupling:
  yaml: config/v2/swirl/whales_multiagent_kin.yaml
  backend: hiavi
  K: [5]

# Test 7: environment-driven switching (predictive: decision-scale variant; descriptive: switch-triggered averages;
# series correlation of the final tools)
env_switch:
  channels: [sst, grad_mag_sst, strat_0_100m, adt, eke, log10_CHL, log10_zooc, depth_m, dist_200m_isobath_km]
  env_tag: core
  variants:
    - {switch_history: {kind: "env"}}
    - {switch_history: {kind: "lags+decay+env"}}
    - {switch_history: {kind: "lags+decay+env"}, durations: "on"}
  levels: [fine]
  window: 3
  n_perm: 500
  correlation_yaml: config/v2/time_series/whales_correlation_final_kin_v2.yaml

# Rep_Taxonomy tools: environment geometry, projection robustness, synthesis, resources
geometry:
  sample_inputs_yaml: config/v2/environment/whales_sample_inputs_v2.yaml
  channels: [sst, grad_mag_sst, strat_0_100m, mlotst, adt, eke, log10_CHL, log10_npp, log10_zooc, o2_0m, depth_m,
             slope_deg, dist_coast_km]
  n_available: 10
  k: 20
  max_points: 20000
  n_perm: 199
  projections: [native, pca, umap, tsne]
  group_regex: {year: "(?:^|_)((?:19|20)\\d\\d)(?:_|$)"}

launcher:
  state_dir: /data/nlahaye/NatureNet/launcher/env_drivers_whales
  gpu_share: 0.25
  hiavi_cpus: 4
  ma_cpus: 4
  null_chunk: 2
  analysis_cpus: 2
