# Track animations for representative whales (v2, kinematic tools). Run from src/naturenet (P=config/v2/plots):
#   python -m naturenet.models.irl.animate_tracks -y $P/whales_animations.yaml --dry-run
#   python -m naturenet.models.irl.animate_tracks -y $P/whales_animations.yaml [--only kin_finals]
# Jobs whose inputs do not exist yet (unfinished scales / multi-agent runs) are skipped with a message.
# Every panel of a job shows the same animal(s) and time window (chosen on the first panel).
root: "/data/nlahaye/NatureNet/Blue_Whale_v2"
out_dir: "{root}/animations/"
dfs_pkl: "{root}/SWIRL_WHALE_1517_dfs.pkl"
df_run_uid: "SWIRL_WHALE_1517"
env_maps: "{root}/env_clusters/final_env_maps_SWIRL_WHALE_1517.pkl"
env_meta_json: "/data/nlahaye/NatureNet_Env/Copernicus/v2/whales/whales_env_meta.json"
background: env            # env | reward | none
zoom: track
pad_deg: 1.0
fps: 4
dpi: 110
format: gif                # gif | mp4 (ffmpeg)
select: {n: 3, strategy: coverage, max_frames: 240, window: best, min_fixes: 60}

animations:
  # 1. single-animal kinematic finals: HIQL K=5 (primary) next to SWIRL S-2 K=5 (secondary)
  - name: kin_finals
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         state_reward: "{root}/final/hiql_kin/plots/state_reward_hiavi_s1.npy"}
      - {name: "SWIRL S-2+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s2",
         state_reward: "{root}/final/swirl_kin/plots/state_reward_linear_s2.npy"}
  # 1b. one whale per HIQL mode, reward of the decoded mode as background
  - name: kin_hiql_by_mode
    background: reward
    select: {strategy: by_mode, max_frames: 160}
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         state_reward: "{root}/final/hiql_kin/plots/state_reward_hiavi_s1.npy"}
  # 2. decision scales (out-of-fold decoding, 5 test folds): N1 vs the scale layers that gained
  - name: scales_hiql
    panels:
      - {name: "HIQL N1", kind: latents, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N1_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL N1+R2", kind: latents, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N1_R2_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL N1+dur", kind: latents, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N1_dur-logi12_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
  # kept for the decision-environment analysis: history (destination) and transition-scale (order 2) views
  - name: scales_hiql_context
    panels:
      - {name: "HIQL N1", kind: latents, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N1_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL N1+hist+dur", kind: latents, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N1_hist-lags+decay_dur-logi12_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL N2", kind: latents, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N2_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
  - name: scales_swirl
    panels:
      - {name: "SWIRL N1", kind: latents, path: "{root}/scales_kin/WHALE_SWIRL_SCALES_KIN_SC_N1_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "SWIRL N1+hist", kind: latents, path: "{root}/scales_kin/WHALE_SWIRL_SCALES_KIN_SC_N1_hist-lags+decay_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "SWIRL N2 (S-2 analogue)", kind: latents, path: "{root}/scales_kin/WHALE_SWIRL_SCALES_KIN_SC_N2_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
  # 3. multi-agent (full-data fits written by the multi-agent K-fold run): independent vs coupled intentions
  - name: ma_hiql
    mode: multi
    select: {window_days: 45, frame_days: 1, max_animals: 12, max_gap_days: 3}
    panels:
      - {name: "HIQL K=5 independent", kind: multiagent, path: "{root}/multiagent/multiagent_kin/ma_final_K5.npz", fit: indep}
      - {name: "HIQL K=5 coupled (temporal)", kind: multiagent, path: "{root}/multiagent/multiagent_kin/ma_final_K5.npz", fit: temporal}
      - {name: "HIQL K=5 coupled (proximity)", kind: multiagent, path: "{root}/multiagent/multiagent_kin/ma_final_K5.npz", fit: proximity}
  - name: ma_scales_hiql
    mode: multi
    select: {window_days: 45, frame_days: 1, max_animals: 12}
    panels:
      - {name: "S1_N1 independent", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_hiql_scales_S1_N1/ma_final_K5.npz", fit: indep}
      - {name: "S1_N1 coupled", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_hiql_scales_S1_N1/ma_final_K5.npz", fit: temporal}
      - {name: "S2_N1_R2 coupled", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_hiql_scales_S2_N1_R2/ma_final_K5.npz", fit: temporal}
  - name: ma_scales_swirl
    mode: multi
    select: {window_days: 45, frame_days: 1, max_animals: 12}
    panels:
      - {name: "SWIRL S1_N2 independent", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_swirl_scales_S1_N2/ma_final_K5.npz", fit: indep}
      - {name: "SWIRL S1_N2 coupled", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_swirl_scales_S1_N2/ma_final_K5.npz", fit: temporal}

  # ---------------------------------------------------------------------------------------------------------------
  # 4. Figure renders (manuscript Figure 2 whale panels / Appendix G). Same conventions as sharks_animations.yaml:
  #    colour_by: class (exploit = blues, explore = reds, ambiguous = greys), labels from the series-based
  #    exploit_explore_init tables (the exported series latent_class / p_exploit are degenerate for whales: HIQL modes
  #    0, 1, 4 'ambiguous', p_exploit 0), Argos jumps > 20 km/h dropped from the drawing (about 15% of whale fixes),
  #    lines broken at gaps > 48 h. Quick re-render without gifs: --stills-only.
  #    2015_5640: longest track (Jul-Dec 2015, 36.8 -> 22.8 N); 2017_841: Jul-Dec 2017 to 22 N.
  - name: fig2_whale_class
    colour_by: class
    jump_filter: {max_speed_kmh: 20}
    break_gap_h: 48
    p_exploit: "off"
    select: {uids: ["2015_5640", "2017_841"],
             windows: {"2015_5640": ["2015-07-16", "2015-12-22"], "2017_841": ["2017-07-11", "2017-12-07"]}}
    stills: ["2015-08-20", "2015-11-10", "2017-08-20", "2017-11-10", -1]
    still_dpi: 220
    still_panels: true
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         state_reward: "{root}/final/hiql_kin/plots/state_reward_hiavi_s1.npy",
         labels_csv: "{root}/final/exploit_explore/hiql_kin_k5/full_exploit_explore.csv"}
  - name: kin_finals_whale_class
    colour_by: class
    jump_filter: {max_speed_kmh: 20}
    break_gap_h: 48
    p_exploit: "off"
    align_modes: true          # S-2 / S-1 mode numbers relabelled to the matching HIQL modes (shared steps)
    select: {uids: ["2015_5640", "2017_841"],
             windows: {"2015_5640": ["2015-07-16", "2015-12-22"], "2017_841": ["2017-07-11", "2017-12-07"]}}
    stills: [0.5, -1]
    still_panels: true
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         labels_csv: "{root}/final/exploit_explore/hiql_kin_k5/full_exploit_explore.csv"}
      - {name: "SWIRL S-2+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s2",
         labels_csv: "{root}/final/exploit_explore/swirl_kin_s2_k5/full_exploit_explore.csv"}
      - {name: "SWIRL S-1+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s1",
         labels_csv: "{root}/final/exploit_explore/swirl_kin_s1_k5/full_exploit_explore.csv"}
  # reward backgrounds: S-2 is the whale tool whose rewards are predictable from the environment (Figure 4)
  - name: reward_whale_class
    background: reward
    colour_by: class
    reward_scale: panel        # S-2 and HIQL rewards differ in scale; 'mode' if the S-2 map is still flat
    jump_filter: {max_speed_kmh: 20}
    break_gap_h: 48
    select: {uids: ["2015_5640"], windows: {"2015_5640": ["2015-07-16", "2015-10-15"]}}
    stills: ["2015-08-20", -1]
    panels:
      - {name: "SWIRL S-2+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s2",
         state_reward: "{root}/final/swirl_kin/plots/state_reward_linear_s2.npy",
         reward_label: "state reward (mean over previous state)",
         labels_csv: "{root}/final/exploit_explore/swirl_kin_s2_k5/full_exploit_explore.csv",
         mode_names: {0: reversal, 1: transit, 4: stationary}}
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         state_reward: "{root}/final/hiql_kin/plots/state_reward_hiavi_s1.npy",
         labels_csv: "{root}/final/exploit_explore/hiql_kin_k5/full_exploit_explore.csv",
         mode_names: {1: reversal, 2: stationary, 3: transit}}
  # pooled seasonality / migration: one frame per month (all 44 whales; Jul-Dec only, empty months dropped),
  # facet grid and month x mode heatmap (+ heatmap-only PNG for the composite seasonal figure). Class colours as in
  # the other figures; mode_names keep transit (HIQL 3 / S-2 1) identifiable next to the reversal (location-error)
  # mode. Months with < 5 whales (Dec: 4) are hatched.
  - name: season_whale
    mode: season
    background: none
    zoom: track
    pad_deg: 0.5
    colour_by: class
    jump_filter: {max_speed_kmh: 20}
    break_gap_h: 48
    season: {bins: month, fps: 1, grid_cols: 3, min_animals: 5, class_rows: true}
    stills: ["Aug", "Oct", "Nov"]
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         labels_csv: "{root}/final/exploit_explore/hiql_kin_k5/full_exploit_explore.csv",
         mode_names: {1: reversal, 2: stationary, 3: transit}}
      - {name: "SWIRL S-2+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s2",
         labels_csv: "{root}/final/exploit_explore/swirl_kin_s2_k5/full_exploit_explore.csv",
         mode_names: {0: reversal, 1: transit, 4: stationary}}
  # QC (supplement / Limitations): the repeated-position stretch that forms HIQL mode 2 / S-2 mode 4.
  # No jump filter, so the record is shown as exported.
  - name: qc_whale_stationary
    colour_by: mode
    clip_to_env: false         # 2015_5678 sits at the northern edge of the env grid (~40 N)
    pad_deg: 1.5
    break_gap_h: 48
    select: {uids: ["2015_5678"], windows: {"2015_5678": ["2015-08-01", "2015-11-20"]}}
    stills: ["2015-09-15", "2015-11-15"]
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         labels_csv: "{root}/final/exploit_explore/hiql_kin_k5/full_exploit_explore.csv"}
      - {name: "SWIRL S-2+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s2",
         labels_csv: "{root}/final/exploit_explore/swirl_kin_s2_k5/full_exploit_explore.csv"}
  # decision-scale variants with mode numbers aligned to N1 (Appendix G). The SWIRL order effect (N2 / N3 gain
  # +0.08 / +0.09 in 5/5 folds) is the main new whale scale result.
  - name: scales_swirl_order_aligned
    align_modes: true
    jump_filter: {max_speed_kmh: 20}
    break_gap_h: 48
    select: {uids: ["2015_5640"]}
    stills: [-1]
    panels:
      - {name: "SWIRL S-1 N1", kind: latents, path: "{root}/scales_kin/WHALE_SWIRL_SCALES_KIN_SC_N1_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "SWIRL S-1 N2", kind: latents, path: "{root}/scales_kin/WHALE_SWIRL_SCALES_KIN_SC_N2_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "SWIRL S-1 N3", kind: latents, path: "{root}/scales_kin/WHALE_SWIRL_SCALES_KIN_SC_N3_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "SWIRL S-1 N1+hist+dur", kind: latents, path: "{root}/scales_kin/WHALE_SWIRL_SCALES_KIN_SC_N1_hist-lags+decay_dur-logi12_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
  - name: scales_hiql_whale_aligned
    align_modes: true
    jump_filter: {max_speed_kmh: 20}
    break_gap_h: 48
    select: {uids: ["2015_5640"]}
    stills: [-1]
    panels:
      - {name: "HIQL K=5 N1", kind: latents, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N1_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL K=5 N1+R2", kind: latents, regime: true, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N1_R2_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL K=5 N1+dur", kind: latents, path: "{root}/scales_kin/WHALE_HIQL_SCALES_KIN_K5_SC_N1_dur-logi12_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
