# Track animations for representative sharks (v2, kinematic tools). Run from src/naturenet (P=config/v2/plots):
#   python -m naturenet.models.irl.animate_tracks -y $P/sharks_animations.yaml --dry-run
#   python -m naturenet.models.irl.animate_tracks -y $P/sharks_animations.yaml [--only kin_finals]
# Jobs whose inputs do not exist yet (unfinished scales / multi-agent runs) are skipped with a message.
# Every panel of a job shows the same animal(s) and time window (chosen on the first panel).
root: "/data/nlahaye/NatureNet/Hammerhead_Out_v2"
out_dir: "{root}/animations/"
dfs_pkl: "{root}/hammerhead_v2_dfs.pkl"
df_run_uid: "hammerhead_v2"
env_maps: "{root}/env_clusters/final_env_maps_hammerhead_v2.pkl"
env_meta_json: "/data/nlahaye/NatureNet_Env/Copernicus/v2/sharks/sharks_env_meta.json"
background: env            # env | reward | none
zoom: track
pad_deg: 1.0
fps: 4
dpi: 110
format: gif                # gif | mp4 (ffmpeg)
select: {n: 3, strategy: coverage, max_frames: 240, window: best, min_fixes: 30}

animations:
  # 1. single-animal kinematic finals: HIQL K=5 (primary) next to SWIRL S-1 K=5 (secondary) and S-2 of the same fit
  - name: kin_finals
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         state_reward: "{root}/final/hiql_kin/plots/state_reward_hiavi_s1.npy"}
      - {name: "SWIRL S-1+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s1",
         state_reward: "{root}/final/swirl_kin/plots/state_reward_linear_s1.npy"}
      - {name: "SWIRL S-2+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s2",
         state_reward: "{root}/final/swirl_kin/plots/state_reward_linear_s2.npy"}
  # earlier secondary (granularity comparison)
  - name: kin_finals_hiql_k2
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         state_reward: "{root}/final/hiql_kin/plots/state_reward_hiavi_s1.npy"}
      - {name: "HIQL+kin K=2", kind: series, path: "{root}/final/hiql_kin_k2/plots/series_hiavi_s1",
         state_reward: "{root}/final/hiql_kin_k2/plots/state_reward_hiavi_s1.npy"}
  - name: kin_swirl_by_mode
    background: reward
    select: {strategy: by_mode, max_frames: 160}
    panels:
      - {name: "SWIRL S-1+kin K=5", kind: series, path: "{root}/final/swirl_kin/plots/series_linear_s1",
         state_reward: "{root}/final/swirl_kin/plots/state_reward_linear_s1.npy"}
  - name: kin_hiql_by_mode
    background: reward
    select: {strategy: by_mode, max_frames: 160}
    panels:
      - {name: "HIQL+kin K=5", kind: series, path: "{root}/final/hiql_kin/plots/series_hiavi_s1",
         state_reward: "{root}/final/hiql_kin/plots/state_reward_hiavi_s1.npy"}
  # 2. decision scales (out-of-fold decoding): N1 vs R2 / durations (the layers with consistent fold gains)
  - name: scales_hiql_k5
    panels:
      - {name: "HIQL K=5 N1", kind: latents, path: "{root}/scales_kin/HIQL_SCALES_KIN_K5_SC_N1_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL K=5 N1+R2", kind: latents, path: "{root}/scales_kin/HIQL_SCALES_KIN_K5_SC_N1_R2_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL K=5 N1+dur", kind: latents, path: "{root}/scales_kin/HIQL_SCALES_KIN_K5_SC_N1_dur-logi12_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
  - name: scales_hiql_k2
    panels:
      - {name: "HIQL K=2 N1", kind: latents, path: "{root}/scales_kin/HIQL_SCALES_KIN_K2_SC_N1_2_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL K=2 N1+R2", kind: latents, path: "{root}/scales_kin/HIQL_SCALES_KIN_K2_SC_N1_R2_2_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL K=2 N1+dur", kind: latents, path: "{root}/scales_kin/HIQL_SCALES_KIN_K2_SC_N1_dur-logi12_2_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "HIQL K=2 N1+hist+dur (hazard)", kind: latents, path: "{root}/scales_kin/HIQL_SCALES_KIN_K2_SC_N1_hist-lags+decay_dur-logi12-hf_2_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
  - name: scales_swirl
    panels:
      - {name: "SWIRL N1", kind: latents, path: "{root}/scales_kin/SHARK_SWIRL_SCALES_KIN_SC_N1_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "SWIRL N1+hist", kind: latents, path: "{root}/scales_kin/SHARK_SWIRL_SCALES_KIN_SC_N1_hist-lags+decay_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "SWIRL N1+dur", kind: latents, path: "{root}/scales_kin/SHARK_SWIRL_SCALES_KIN_SC_N1_dur-logi12_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
      - {name: "SWIRL N2 (order test)", kind: latents, path: "{root}/scales_kin/SHARK_SWIRL_SCALES_KIN_SC_N2_5_12345_naturenet_S1_iter2_LL1_test_KF_*.npz"}
  # 3. multi-agent (9 sharks; full-data fits from the multi-agent K-fold run)
  - name: ma_hiql_k5
    mode: multi
    select: {window_days: 60, frame_days: 1, max_gap_days: 3}
    panels:
      - {name: "HIQL K=5 independent", kind: multiagent, path: "{root}/multiagent/multiagent_kin/ma_final_K5.npz", fit: indep}
      - {name: "HIQL K=5 coupled (temporal)", kind: multiagent, path: "{root}/multiagent/multiagent_kin/ma_final_K5.npz", fit: temporal}
      - {name: "HIQL K=5 coupled (proximity)", kind: multiagent, path: "{root}/multiagent/multiagent_kin/ma_final_K5.npz", fit: proximity}
  - name: ma_hiql_k2
    mode: multi
    select: {window_days: 60, frame_days: 1, max_gap_days: 3}
    panels:
      - {name: "HIQL K=2 independent", kind: multiagent, path: "{root}/multiagent/multiagent_kin/ma_final_K2.npz", fit: indep}
      - {name: "HIQL K=2 coupled (temporal)", kind: multiagent, path: "{root}/multiagent/multiagent_kin/ma_final_K2.npz", fit: temporal}
  - name: ma_scales_hiql_k5
    mode: multi
    select: {window_days: 60, frame_days: 1}
    panels:
      - {name: "S1_N1 coupled", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_hiql_scales_S1_N1/ma_final_K5.npz", fit: temporal}
      - {name: "S2_N1_R2 coupled", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_hiql_scales_S2_N1_R2/ma_final_K5.npz", fit: temporal}
  - name: ma_swirl_k5
    mode: multi
    select: {window_days: 60, frame_days: 1, max_gap_days: 3}
    panels:
      - {name: "SWIRL K=5 independent", kind: multiagent, path: "{root}/multiagent/multiagent_swirl_kin/ma_final_K5.npz", fit: indep}
      - {name: "SWIRL K=5 coupled (temporal)", kind: multiagent, path: "{root}/multiagent/multiagent_swirl_kin/ma_final_K5.npz", fit: temporal}
      - {name: "SWIRL K=5 coupled (proximity)", kind: multiagent, path: "{root}/multiagent/multiagent_swirl_kin/ma_final_K5.npz", fit: proximity}
  - name: ma_scales_swirl_k5
    mode: multi
    select: {window_days: 60, frame_days: 1}
    panels:
      - {name: "SWIRL S1_N1 coupled", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_swirl_scales_S1_N1/ma_final_K5.npz", fit: temporal}
      - {name: "SWIRL S1_N2 coupled", kind: multiagent, path: "{root}/multiagent_scales_kin/multiagent_swirl_scales_S1_N2/ma_final_K5.npz", fit: temporal}
